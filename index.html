const programs = {"dotnet":[{"title":"Employee Payroll","body":"**Project type:** C# Console Application\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\n\nclass Employee\n{\n    public int EmpId;\n    public string Name;\n    public double BasicSalary;\n    public double DA;\n    public double HRA;\n    public double PF;\n    public double GrossSalary;\n    public double NetSalary;\n\n    public void CalculateSalary()\n    {\n        DA = BasicSalary * 0.10;   // 10% DA\n        HRA = BasicSalary * 0.20; // 20% HRA\n        PF = BasicSalary * 0.12;   // 12% PF\n        GrossSalary = BasicSalary + DA + HRA;\n        NetSalary = GrossSalary - PF;\n    }\n\n    public void Display()\n    {\n        Console.WriteLine(\"\\nEmployee Payroll Details\");\n        Console.WriteLine(\"-----------------------\");\n        Console.WriteLine(\"Employee ID : \" + EmpId);\n        Console.WriteLine(\"Name         : \" + Name);\n        Console.WriteLine(\"Basic Salary : \" + BasicSalary);\n        Console.WriteLine(\"DA           : \" + DA);\n        Console.WriteLine(\"HRA          : \" + HRA);\n        Console.WriteLine(\"PF           : \" + PF);\n        Console.WriteLine(\"Gross Salary : \" + GrossSalary);\n        Console.WriteLine(\"Net Salary   : \" + NetSalary);\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Employee emp = new Employee();\n\n        Console.Write(\"Enter Employee ID: \");\n        int employeeId;\n        if (!int.TryParse(Console.ReadLine(), out employeeId) || employeeId <= 0)\n        {\n            Console.WriteLine(\"Employee ID must be a positive whole number.\");\n            Console.ReadLine();\n            return;\n        }\n        emp.EmpId = employeeId;\n\n        Console.Write(\"Enter Employee Name: \");\n        emp.Name = (Console.ReadLine() ?? \"\").Trim();\n        if (emp.Name.Length == 0)\n        {\n            Console.WriteLine(\"Employee name is required.\");\n            Console.ReadLine();\n            return;\n        }\n\n        Console.Write(\"Enter Basic Salary: \");\n        double salary;\n        if (!double.TryParse(Console.ReadLine(), out salary) || salary < 0 || double.IsNaN(salary) || double.IsInfinity(salary))\n        {\n            Console.WriteLine(\"Enter a valid non-negative salary.\");\n            Console.ReadLine();\n            return;\n        }\n        emp.BasicSalary = salary;\n        emp.CalculateSalary();\n        emp.Display();\n        Console.ReadLine();\n    }\n}\n```","id":"dotnet-1","html":"<p><strong>Project type:</strong> C# Console Application</p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\n\nclass Employee\n{\n    public int EmpId;\n    public string Name;\n    public double BasicSalary;\n    public double DA;\n    public double HRA;\n    public double PF;\n    public double GrossSalary;\n    public double NetSalary;\n\n    public void CalculateSalary()\n    {\n        DA = BasicSalary * 0.10;   // 10% DA\n        HRA = BasicSalary * 0.20; // 20% HRA\n        PF = BasicSalary * 0.12;   // 12% PF\n        GrossSalary = BasicSalary + DA + HRA;\n        NetSalary = GrossSalary - PF;\n    }\n\n    public void Display()\n    {\n        Console.WriteLine(&quot;\\nEmployee Payroll Details&quot;);\n        Console.WriteLine(&quot;-----------------------&quot;);\n        Console.WriteLine(&quot;Employee ID : &quot; + EmpId);\n        Console.WriteLine(&quot;Name         : &quot; + Name);\n        Console.WriteLine(&quot;Basic Salary : &quot; + BasicSalary);\n        Console.WriteLine(&quot;DA           : &quot; + DA);\n        Console.WriteLine(&quot;HRA          : &quot; + HRA);\n        Console.WriteLine(&quot;PF           : &quot; + PF);\n        Console.WriteLine(&quot;Gross Salary : &quot; + GrossSalary);\n        Console.WriteLine(&quot;Net Salary   : &quot; + NetSalary);\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Employee emp = new Employee();\n\n        Console.Write(&quot;Enter Employee ID: &quot;);\n        emp.EmpId = Convert.ToInt32(Console.ReadLine());\n\n        Console.Write(&quot;Enter Employee Name: &quot;);\n        emp.Name = Console.ReadLine();\n\n        Console.Write(&quot;Enter Basic Salary: &quot;);\n        emp.BasicSalary = Convert.ToDouble(Console.ReadLine());\n\n        emp.CalculateSalary();\n        emp.Display();\n\n        Console.ReadLine();\n    }\n}</code></pre></div>"},{"title":"Bank Application","body":"**Project type:** C# Console Application\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nclass Program\n{\n    static void Main()\n    {\n        double balance = 1000;\n        int choice;\n        do\n        {\n            Console.WriteLine(\"\\n--- BANK APPLICATION ---\");\n            Console.WriteLine(\"1. Check Balance\");\n            Console.WriteLine(\"2. Deposit\");\n            Console.WriteLine(\"3. Withdraw\");\n            Console.WriteLine(\"4. Exit\");\n            Console.Write(\"Enter choice: \");\n            if (!int.TryParse(Console.ReadLine(), out choice))\n            {\n                Console.WriteLine(\"Enter a number from 1 to 4.\");\n                choice = 0;\n                continue;\n            }\n            switch (choice)\n            {\n                case 1:\n                    Console.WriteLine(\"Balance = ₹\" + balance);\n                    break;\n                case 2:\n                    Console.Write(\"Enter deposit amount: \");\n                    double deposit;\n                    if (!double.TryParse(Console.ReadLine(), out deposit) || deposit <= 0 || double.IsNaN(deposit) || double.IsInfinity(deposit))\n                    {\n                        Console.WriteLine(\"Deposit must be a positive valid amount.\");\n                        break;\n                    }\n                    balance += deposit;\n                    Console.WriteLine(\"Deposit successful\");\n                    break;\n                case 3:\n                    Console.Write(\"Enter withdraw amount: \");\n                    double withdraw;\n                    if (!double.TryParse(Console.ReadLine(), out withdraw) || withdraw <= 0 || double.IsNaN(withdraw) || double.IsInfinity(withdraw))\n                    {\n                        Console.WriteLine(\"Withdrawal must be a positive valid amount.\");\n                        break;\n                    }\n                    if (withdraw <= balance)\n                    {\n                         balance = balance - withdraw;\n                         Console.WriteLine(\"Withdrawal successful\");\n                    }\n                    else\n                    {\n                         Console.WriteLine(\"Insufficient balance\");\n                    }\n                    break;\n                case 4:\n                    Console.WriteLine(\"Thank You!\");\n                    break;\n                default:\n                    Console.WriteLine(\"Invalid choice\");\n                    break;\n            }\n        } while (choice != 4);\n    }\n}\n```","id":"dotnet-2","html":"<p><strong>Project type:</strong> C# Console Application</p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\nclass Program\n{\n    static void Main()\n    {\n        double balance = 1000;\n        int choice;\n        do\n        {\n            Console.WriteLine(&quot;\\n--- BANK APPLICATION ---&quot;);\n            Console.WriteLine(&quot;1. Check Balance&quot;);\n            Console.WriteLine(&quot;2. Deposit&quot;);\n            Console.WriteLine(&quot;3. Withdraw&quot;);\n            Console.WriteLine(&quot;4. Exit&quot;);\n            Console.Write(&quot;Enter choice: &quot;);\n            choice = Convert.ToInt32(Console.ReadLine());\n            switch (choice)\n            {\n                case 1:\n                    Console.WriteLine(&quot;Balance = ₹&quot; + balance);\n                    break;\n                case 2:\n                    Console.Write(&quot;Enter deposit amount: &quot;);\n                    double deposit = Convert.ToDouble(Console.ReadLine());\n                    balance = balance + deposit;\n                    Console.WriteLine(&quot;Deposit successful&quot;);\n                    break;\n                case 3:\n                    Console.Write(&quot;Enter withdraw amount: &quot;);\n                    double withdraw = Convert.ToDouble(Console.ReadLine());\n                    if (withdraw &lt;= balance)\n                    {\n                         balance = balance - withdraw;\n                         Console.WriteLine(&quot;Withdrawal successful&quot;);\n                    }\n                    else\n                    {\n                         Console.WriteLine(&quot;Insufficient balance&quot;);\n                    }\n                    break;\n                case 4:\n                    Console.WriteLine(&quot;Thank You!&quot;);\n                    break;\n                default:\n                    Console.WriteLine(&quot;Invalid choice&quot;);\n                    break;\n            }\n        } while (choice != 4);\n    }\n}</code></pre></div>"},{"title":"General Knowledge Quiz","body":"**Project type:** C# Windows Forms\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThis is based on the supplied PDF. It assumes the form contains `panel1` through `panel4`, `label7`, `timer1`, `textBox1` through `textBox5`, and the radio buttons shown in the form designer. The score fields are initialized to zero and parsed safely so unanswered fields do not crash the program.\n\n```csharp\nusing System;\nusing System.Windows.Forms;\n\nnamespace QUIZ\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void Form1_Load(object sender, EventArgs e)\n        {\n            panel1.Visible = false;\n            panel2.Visible = false;\n            panel3.Visible = false;\n            panel4.Visible = false;\n            textBox1.Visible = false;\n            textBox2.Visible = false;\n            textBox3.Visible = false;\n            textBox4.Visible = false;\n            textBox1.Text = textBox2.Text = textBox3.Text = textBox4.Text = \"0\";\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            timer1.Start();\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            timer1.Stop();\n        }\n\n        private void timer1_Tick(object sender, EventArgs e)\n        {\n            int value;\n            if (!int.TryParse(label7.Text, out value)) value = 0;\n            value++;\n            label7.Text = value.ToString();\n\n            panel1.Visible = value < 10;\n            panel2.Visible = value >= 10 && value < 20;\n            panel3.Visible = value >= 20 && value < 30;\n            panel4.Visible = value >= 30 && value < 40;\n\n            if (value >= 40)\n            {\n                timer1.Stop();\n                MessageBox.Show(\"Time is up\");\n            }\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            textBox1.Visible = textBox2.Visible = textBox3.Visible = textBox4.Visible = true;\n            int score = ReadScore(textBox1.Text) + ReadScore(textBox2.Text)\n                      + ReadScore(textBox3.Text) + ReadScore(textBox4.Text);\n            textBox5.Text = score.ToString();\n        }\n\n        private static int ReadScore(string value)\n        {\n            return int.TryParse(value, out int score) ? score : 0;\n        }\n\n        private void radioButton2_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton2.Checked) textBox1.Text = \"1\";\n        }\n\n        private void radioButton7_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton7.Checked) textBox2.Text = \"1\";\n        }\n\n        private void radioButton11_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton11.Checked) textBox3.Text = \"1\";\n        }\n\n        private void radioButton16_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton16.Checked) textBox4.Text = \"1\";\n        }\n    }\n}\n```\n\n**Important:** This corrects empty-score parsing but still depends on the question controls and event handlers being connected in the Visual Studio Designer. Verify that the listed radio buttons correspond to the correct answers in the supplied quiz form.","id":"dotnet-3","html":"<p><strong>Project type:</strong> C# Windows Forms</p>\n<p>This is based on the supplied PDF. It assumes the form contains <code>panel1</code> through <code>panel4</code>, <code>label7</code>, <code>timer1</code>, <code>textBox1</code> through <code>textBox5</code>, and the radio buttons shown in the form designer. The score fields are initialized to zero and parsed safely so unanswered fields do not crash the program.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\nusing System.Windows.Forms;\n\nnamespace QUIZ\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void Form1_Load(object sender, EventArgs e)\n        {\n            panel1.Visible = false;\n            panel2.Visible = false;\n            panel3.Visible = false;\n            panel4.Visible = false;\n            textBox1.Visible = false;\n            textBox2.Visible = false;\n            textBox3.Visible = false;\n            textBox4.Visible = false;\n            textBox1.Text = textBox2.Text = textBox3.Text = textBox4.Text = &quot;0&quot;;\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            timer1.Start();\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            timer1.Stop();\n        }\n\n        private void timer1_Tick(object sender, EventArgs e)\n        {\n            if (!int.TryParse(label7.Text, out int value)) value = 0;\n            value++;\n            label7.Text = value.ToString();\n\n            panel1.Visible = value &lt; 10;\n            panel2.Visible = value &gt;= 10 &amp;&amp; value &lt; 20;\n            panel3.Visible = value &gt;= 20 &amp;&amp; value &lt; 30;\n            panel4.Visible = value &gt;= 30 &amp;&amp; value &lt; 40;\n\n            if (value &gt;= 40)\n            {\n                timer1.Stop();\n                MessageBox.Show(&quot;Time is up&quot;);\n            }\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            textBox1.Visible = textBox2.Visible = textBox3.Visible = textBox4.Visible = true;\n            int score = ReadScore(textBox1.Text) + ReadScore(textBox2.Text)\n                      + ReadScore(textBox3.Text) + ReadScore(textBox4.Text);\n            textBox5.Text = score.ToString();\n        }\n\n        private static int ReadScore(string value)\n        {\n            return int.TryParse(value, out int score) ? score : 0;\n        }\n\n        private void radioButton2_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton2.Checked) textBox1.Text = &quot;1&quot;;\n        }\n\n        private void radioButton7_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton7.Checked) textBox2.Text = &quot;1&quot;;\n        }\n\n        private void radioButton11_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton11.Checked) textBox3.Text = &quot;1&quot;;\n        }\n\n        private void radioButton16_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton16.Checked) textBox4.Text = &quot;1&quot;;\n        }\n    }\n}</code></pre></div>\n<p><strong>Important:</strong> This corrects empty-score parsing but still depends on the question controls and event handlers being connected in the Visual Studio Designer. Verify that the listed radio buttons correspond to the correct answers in the supplied quiz form.</p>"},{"title":"Dialog Boxes (Font, Color, Open File, Save File)","body":"**Project type:** C# Windows Forms\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace DIALOGBOX\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            FontDialog fontDialog1 = new FontDialog();\n            if (fontDialog1.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.Font = fontDialog1.Font;\n            }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            ColorDialog colorDialog1 = new ColorDialog();\n            if (colorDialog1.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.ForeColor = colorDialog1.Color;\n            }\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            OpenFileDialog openFileDialog1 = new OpenFileDialog();\n            openFileDialog.Filter =\n                \"Text Files (*.txt)|*.txt|All Files (*.*)|*.*\";\n            if (openFileDialog1.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.Text =\n                    File.ReadAllText(openFileDialog1.FileName);\n            }\n        }\n\n        private void button4_Click(object sender, EventArgs e)\n        {\n            SaveFileDialog saveFileDialog1 = new SaveFileDialog();\n            saveFileDialog.Filter =\n                \"Text Files (*.txt)|*.txt|All Files (*.*)|*.*\";\n            if (saveFileDialog1.ShowDialog() == DialogResult.OK)\n            {\n                File.WriteAllText(\n                    saveFileDialog1.FileName,\n                    richTextBox1.Text);\n                MessageBox.Show(\n                    \"File saved successfully.\",\n                    \"Save\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Information);\n            }\n        }\n    }\n}\n```","id":"dotnet-4","html":"<p><strong>Project type:</strong> C# Windows Forms</p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace DIALOGBOX\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            FontDialog fontDialog = new FontDialog();\n            if (fontDialog.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.Font = fontDialog.Font;\n            }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            ColorDialog colorDialog = new ColorDialog();\n            if (colorDialog.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.ForeColor = colorDialog.Color;\n            }\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            OpenFileDialog openFileDialog = new OpenFileDialog();\n            openFileDialog.Filter =\n                &quot;Text Files (*.txt)|*.txt|All Files (*.*)|*.*&quot;;\n            if (openFileDialog.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.Text =\n                    File.ReadAllText(openFileDialog.FileName);\n            }\n        }\n\n        private void button4_Click(object sender, EventArgs e)\n        {\n            SaveFileDialog saveFileDialog = new SaveFileDialog();\n            saveFileDialog.Filter =\n                &quot;Text Files (*.txt)|*.txt|All Files (*.*)|*.*&quot;;\n            if (saveFileDialog.ShowDialog() == DialogResult.OK)\n            {\n                File.WriteAllText(\n                    saveFileDialog.FileName,\n                    richTextBox1.Text);\n                MessageBox.Show(\n                    &quot;File saved successfully.&quot;,\n                    &quot;Save&quot;,\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Information);\n            }\n        }\n    }\n}</code></pre></div>"},{"title":"Sort, Find, Count and Select","body":"**Project type:** C# Windows Forms\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Windows.Forms;\nusing Microsoft.VisualBasic;\n\nnamespace SortFindCountSelect\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            string item = Interaction.InputBox(\n                \"Enter an item:\", \"Add Item\");\n            if (item != \"\")\n                listBox1.Items.Add(item);\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            listBox1.Sorted = true;\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            string item = Interaction.InputBox(\n                 \"Enter item to find:\", \"Find Item\");\n            int index = listBox1.FindString(item);\n            if (index >= 0)\n            {\n                 listBox1.SelectedIndex = index;\n                 MessageBox.Show(\"Item found.\");\n            }\n            else\n            {\n                 MessageBox.Show(\"Item not found.\");\n            }\n        }\n\n        private void button4_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\n                \"Total number of items: \" + listBox1.Items.Count);\n        }\n\n        private void button5_Click(object sender, EventArgs e)\n        {\n            if (listBox1.SelectedIndex >= 0)\n            {\n                 MessageBox.Show(\n                     \"Selected Item: \" +\n                     listBox1.SelectedItem.ToString());\n            }\n            else\n            {\n                 MessageBox.Show(\"Please select an item.\");\n            }\n        }\n    }\n}\n```","id":"dotnet-5","html":"<p><strong>Project type:</strong> C# Windows Forms</p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\nusing System.Windows.Forms;\nusing Microsoft.VisualBasic;\n\nnamespace SortFindCountSelect\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void btnAdd_Click(object sender, EventArgs e)\n        {\n            string item = Interaction.InputBox(\n                &quot;Enter an item:&quot;, &quot;Add Item&quot;);\n            if (item != &quot;&quot;)\n                listBox1.Items.Add(item);\n        }\n\n        private void btnSort_Click(object sender, EventArgs e)\n        {\n            listBox1.Sorted = true;\n        }\n\n        private void btnFind_Click(object sender, EventArgs e)\n        {\n            string item = Interaction.InputBox(\n                 &quot;Enter item to find:&quot;, &quot;Find Item&quot;);\n            int index = listBox1.FindString(item);\n            if (index &gt;= 0)\n            {\n                 listBox1.SelectedIndex = index;\n                 MessageBox.Show(&quot;Item found.&quot;);\n            }\n            else\n            {\n                 MessageBox.Show(&quot;Item not found.&quot;);\n            }\n        }\n\n        private void btnCount_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\n                &quot;Total number of items: &quot; + listBox1.Items.Count);\n        }\n\n        private void btnSelect_Click(object sender, EventArgs e)\n        {\n            if (listBox1.SelectedIndex &gt;= 0)\n            {\n                 MessageBox.Show(\n                     &quot;Selected Item: &quot; +\n                     listBox1.SelectedItem.ToString());\n            }\n            else\n            {\n                 MessageBox.Show(&quot;Please select an item.&quot;);\n            }\n        }\n    }\n}</code></pre></div>"},{"title":"Student Information and Age","body":"**Project type:** C# Windows Forms\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace StudentInformation\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            string rollNo = textBox1.Text.Trim();\n            string name = textBox2.Text.Trim();\n            string course = comboBox1.Text;\n            DateTime dob = dateTimePicker1.Value;\n\n            int age = DateTime.Today.Year - dob.Year;\n            if (dob.Date > DateTime.Today.AddYears(-age))\n            {\n                age--;\n            }\n\n            label5.Text = \"Register Number: \" + rollNo +\n                          \"\\nStudent Name: \" + name +\n                          \"\\nCourse: \" + course +\n                          \"\\nDate of Birth: \" + dob.ToString(\"dd-MM-yyyy\") +\n                          \"\\nAge: \" + age + \" Years\";\n        }\n    }\n}\n```","id":"dotnet-6","html":"<p><strong>Project type:</strong> C# Windows Forms</p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace StudentInformation\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            string rollNo = textBox1.Text;\n            string name = textBox2.Text;\n            string course = comboBox1.Text;\n            DateTime dob = dateTimePicker1.Value;\n\n            int age = DateTime.Today.Year - dob.Year;\n            if (dob.Date &gt; DateTime.Today.AddYears(-age))\n            {\n                age--;\n            }\n\n            label5.Text = &quot;Register Number: &quot; + rollNo +\n                          &quot;\\nStudent Name: &quot; + name +\n                          &quot;\\nCourse: &quot; + course +\n                          &quot;\\nDate of Birth: &quot; + dob.ToString(&quot;dd-MM-yyyy&quot;) +\n                          &quot;\\nAge: &quot; + age + &quot; Years&quot;;\n        }\n    }\n}</code></pre></div>"},{"title":"Bus Ticket Reservation (MDI)","body":"**Project type:** C# Windows Forms\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace busticketreservation\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n           private void reservationToolStripMenuItem_Click(object sender,\n               EventArgs e)\n           {\n               Reservation r = new busticketreservation.Reservation();\n               r.MdiParent = this;\n               r.Show();\n           }\n\n           private void exitToolStripMenuItem_Click(object sender, EventArgs e)\n           {\n               Application.Exit();\n           }\n\n           private void busTicketReservationToolStripMenuItem_Click(object sender,\n               EventArgs e)\n           {\n           }\n    }\n}\n\n// Reservation.cs\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace busticketreservation\n{\n    public partial class Reservation : Form\n    {\n        public Reservation()\n        {\n            InitializeComponent();\n        }\n\n           private void button2_Click(object sender, EventArgs e)\n\n        {\n            textBox1.Clear();\n            textBox2.Clear();\n            comboBox1.SelectedIndex = -1;\n            comboBox2.SelectedIndex = -1;\n            comboBox3.SelectedIndex = -1;\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            int ticketCount;\n            if (textBox1.Text.Trim().Length == 0 || comboBox1.SelectedIndex < 0 || comboBox2.SelectedIndex < 0 || comboBox3.SelectedIndex < 0 || !int.TryParse(textBox2.Text, out ticketCount) || ticketCount <= 0)\n            {\n                MessageBox.Show(\"Enter passenger name, select the route and bus type, and enter a positive ticket count.\", \"Validation\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n                return;\n            }\n            if (comboBox1.SelectedIndex == comboBox2.SelectedIndex)\n            {\n                MessageBox.Show(\"From and To must be different.\", \"Validation\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n                return;\n            }\n            MessageBox.Show(\"Ticket booked successfully.\", \"Reservation\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\"PASSENGER:\" + textBox1.Text +\n                \"\\nFROM:\" + comboBox1.Text +\n                \"\\nTO:\" + comboBox2.Text +\n                \"\\nBUS TYPE:\" + comboBox3.Text +\n                \"\\nNO OF TICKETS:\" + textBox2.Text +\n                \"\\nJOURNEY DATE:\" + dateTimePicker1.Text);\n        }\n    }\n}\n```","id":"dotnet-7","html":"<p><strong>Project type:</strong> C# Windows Forms</p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace busticketreservation\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n           private void reservationToolStripMenuItem_Click(object sender,\n               EventArgs e)\n           {\n               Reservation r = new busticketreservation.Reservation();\n               r.MdiParent = this;\n               r.Show();\n           }\n\n           private void exitToolStripMenuItem_Click(object sender, EventArgs e)\n           {\n               Application.Exit();\n           }\n\n           private void busTicketReservationToolStripMenuItem_Click(object sender,\n               EventArgs e)\n           {\n           }\n    }\n}\n\n// Reservation.cs\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace busticketreservation\n{\n    public partial class Reservation : Form\n    {\n        public Reservation()\n        {\n            InitializeComponent();\n        }\n\n           private void button2_Click(object sender, EventArgs e)\n\n        {\n            textBox1.Clear();\n            textBox2.Clear();\n            comboBox1.SelectedIndex = -1;\n            comboBox2.SelectedIndex = -1;\n            comboBox3.SelectedIndex = -1;\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            if (textBox1.Text == &quot; &quot;)\n                 MessageBox.Show(&quot;Enter Passengar Details&quot;);\n            else\n                 MessageBox.Show(&quot;Ticket Booked Suuceesfully&quot;);\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(&quot;PASSENGAR:&quot; + textBox1.Text +\n                &quot;\\nFROM:&quot; + comboBox1.Text +\n                &quot;\\nTO:&quot; + comboBox2.Text +\n                &quot;\\nBUS TYPE:&quot; + comboBox3.Text +\n                &quot;\\nNO OF TICKETS:&quot; + textBox2.Text +\n                &quot;\\nJOURNEY DATE:&quot; + dateTimePicker1.Text);\n        }\n    }\n}</code></pre></div>"},{"title":"Mileage Calculator (Windows Forms)","body":"**Project type:** C# Windows Forms\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\n**Form controls:** `textBox1` for distance in kilometres, `textBox2` for fuel consumed in litres, `button1` to calculate, and `label4` to display mileage.\n\n**Aim:** To calculate a vehicle’s mileage in kilometres per litre and handle invalid numeric input or zero fuel consumption.\n\n**Algorithm:**\n1. Read the distance travelled from `textBox1`.\n2. Read the fuel consumed from `textBox2`.\n3. Convert both inputs to numbers.\n4. If fuel consumed is zero, raise a divide-by-zero exception.\n5. Calculate mileage as distance divided by fuel consumed.\n6. Display the result in `label4`.\n7. Show an appropriate message if the input is invalid or fuel is zero.\n\n**Code:**\n\n```csharp\nusing System;\nusing System.Windows.Forms;\n\nnamespace MileageCalculator\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            try\n            {\n                double distance = Convert.ToDouble(textBox1.Text);\n                double fuel = Convert.ToDouble(textBox2.Text);\n\n                if (distance < 0 || double.IsNaN(distance) || double.IsInfinity(distance))\n                {\n                    MessageBox.Show(\"Distance must be a valid non-negative number.\", \"Input Error\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n                    return;\n                }\n                if (fuel <= 0 || double.IsNaN(fuel) || double.IsInfinity(fuel))\n                {\n                    MessageBox.Show(\"Fuel consumed must be greater than zero.\", \"Input Error\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n                    return;\n                }\n                double mileage = distance / fuel;\n\n                label4.Text = \"Mileage = \" + mileage + \" km/litre\";\n            }\n            catch (FormatException)\n            {\n                MessageBox.Show(\n                    \"Please enter valid numbers.\",\n                    \"Input Error\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n            }\n            catch (DivideByZeroException)\n            {\n                MessageBox.Show(\n                    \"Fuel consumed cannot be zero.\",\n                    \"Runtime Error\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Error);\n            }\n        }\n    }\n}\n```","id":"dotnet-8"},{"title":"File Download with Progress Bar","body":"**Project type:** C# Windows Forms\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.Net;\n\nnamespace Progress\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        WebClient wc = new WebClient();\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            SaveFileDialog sfd = new SaveFileDialog();\n            if (sfd.ShowDialog() == DialogResult.OK)\n            {\n                wc.DownloadProgressChanged -= progress;\n                wc.DownloadFileCompleted -= completed;\n                wc.DownloadProgressChanged += progress;\n                wc.DownloadFileCompleted += completed;\n                Uri downloadUri;\n                if (!Uri.TryCreate(textBox1.Text.Trim(), UriKind.Absolute, out downloadUri) ||\n                    (downloadUri.Scheme != Uri.UriSchemeHttp && downloadUri.Scheme != Uri.UriSchemeHttps))\n                {\n                    MessageBox.Show(\"Enter a valid HTTP or HTTPS URL.\", \"Invalid URL\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n                    return;\n                }\n                try\n                {\n                    wc.DownloadFileAsync(downloadUri, sfd.FileName);\n                }\n                catch (Exception ex)\n                {\n                    MessageBox.Show(\"Could not start download: \" + ex.Message, \"Download Error\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n                }\n                toolStripStatusLabel1.Text = \"Downloading...\";\n                Application.DoEvents();\n            }\n        }\n\n        void progress(object sender, DownloadProgressChangedEventArgs e)\n        {\n            progressBar1.Value = e.ProgressPercentage;\n            toolStripStatusLabel1.Text = \"Progress: \" +\n                e.ProgressPercentage + \"%\";\n            Application.DoEvents();\n        }\n\n        void completed(object sender,\n            System.ComponentModel.AsyncCompletedEventArgs e)\n        {\n            progressBar1.Value = 100;\n            toolStripStatusLabel1.Text = \"Download Completed\";\n            MessageBox.Show(\"File Downloaded Successfully\");\n        }\n\n        private void statusStrip1_ItemClicked(object sender,\n            ToolStripItemClickedEventArgs e)\n        {\n        }\n    }\n}\n```","id":"dotnet-9","html":"<p><strong>Project type:</strong> C# Windows Forms</p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.Net;\n\nnamespace Progress\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        WebClient wc = new WebClient();\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            SaveFileDialog sfd = new SaveFileDialog();\n            if (sfd.ShowDialog() == DialogResult.OK)\n            {\n                wc.DownloadProgressChanged += progress;\n                wc.DownloadFileCompleted += completed;\n                wc.DownloadFileAsync(\n                    new Uri(textBox1.Text),\n                    sfd.FileName);\n                toolStripStatusLabel1.Text = &quot;Downloading...&quot;;\n                Application.DoEvents();\n            }\n        }\n\n        void progress(object sender, DownloadProgressChangedEventArgs e)\n        {\n            progressBar1.Value = e.ProgressPercentage;\n            toolStripStatusLabel1.Text = &quot;Progress: &quot; +\n                e.ProgressPercentage + &quot;%&quot;;\n            Application.DoEvents();\n        }\n\n        void completed(object sender,\n            System.ComponentModel.AsyncCompletedEventArgs e)\n        {\n            progressBar1.Value = 100;\n            toolStripStatusLabel1.Text = &quot;Download Completed&quot;;\n            MessageBox.Show(&quot;File Downloaded Successfully&quot;);\n        }\n\n        private void statusStrip1_ItemClicked(object sender,\n            ToolStripItemClickedEventArgs e)\n        {\n        }\n    }\n}</code></pre></div>"},{"title":"File Upload","body":"**Project type:** C# Windows Forms\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.IO;\n\nnamespace Program10\n{\n    public partial class Form1 : Form\n    {\n        string selectedFile = \"\";\n\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            OpenFileDialog openFileDialog1 = new OpenFileDialog();\n            openFileDialog.Title = \"Select Document File\";\n            openFileDialog.Filter =\n                \"Document Files|*.doc;*.docx;*.pdf;*.txt;*.xls;*.xlsx|\" +\n                \"All Files|*.*\";\n\n            if (openFileDialog1.ShowDialog() == DialogResult.OK)\n            {\n                selectedFile = openFileDialog1.FileName;\n                textBox1.Text = selectedFile;\n            }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            if (selectedFile == \"\")\n            {\n                MessageBox.Show(\"Please select a document file.\",\n                    \"Warning\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n                return;\n            }\n\n            try\n            {\n                  string destinationDirectory = @\"C:\\MyDocuments\";\n\n                  if (!Directory.Exists(destinationDirectory))\n                  {\n                      Directory.CreateDirectory(destinationDirectory);\n                  }\n\n                  string fileName = Path.GetFileName(selectedFile);\n                  string destinationFile =\n                      Path.Combine(destinationDirectory, fileName);\n\n                  File.Copy(selectedFile, destinationFile, true);\n\n                MessageBox.Show(\n                    \"File copied successfully!\\n\\n\" +\n                    \"Saved Location:\\n\" + destinationFile,\n                    \"Copy Successful\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Information);\n\n                label1.Text = \"File copied successfully.\";\n            }\n            catch (Exception ex)\n            {\n                MessageBox.Show(\n                    \"Error: \" + ex.Message,\n                    \"Upload Error\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Error);\n            }\n        }\n    }\n}\n```","id":"dotnet-10","html":"<p><strong>Project type:</strong> C# Windows Forms</p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.IO;\n\nnamespace Program10\n{\n    public partial class Form1 : Form\n    {\n        string selectedFile = &quot;&quot;;\n\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            OpenFileDialog openFileDialog = new OpenFileDialog();\n            openFileDialog.Title = &quot;Select Document File&quot;;\n            openFileDialog.Filter =\n                &quot;Document Files|*.doc;*.docx;*.pdf;*.txt;*.xls;*.xlsx|&quot; +\n                &quot;All Files|*.*&quot;;\n\n            if (openFileDialog.ShowDialog() == DialogResult.OK)\n            {\n                selectedFile = openFileDialog.FileName;\n                textBox1.Text = selectedFile;\n            }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            if (selectedFile == &quot;&quot;)\n            {\n                MessageBox.Show(&quot;Please select a document file.&quot;,\n                    &quot;Warning&quot;,\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n                return;\n            }\n\n            try\n            {\n                  string destinationDirectory = @&quot;C:\\MyDocuments&quot;;\n\n                  if (!Directory.Exists(destinationDirectory))\n                  {\n                      Directory.CreateDirectory(destinationDirectory);\n                  }\n\n                  string fileName = Path.GetFileName(selectedFile);\n                  string destinationFile =\n                      Path.Combine(destinationDirectory, fileName);\n\n                  File.Copy(selectedFile, destinationFile, true);\n\n                MessageBox.Show(\n                    &quot;Document uploaded successfully!\\n\\n&quot; +\n                    &quot;Saved Location:\\n&quot; + destinationFile,\n                    &quot;Upload Successful&quot;,\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Information);\n\n                label1.Text = &quot;File uploaded successfully.&quot;;\n            }\n            catch (Exception ex)\n            {\n                MessageBox.Show(\n                    &quot;Error: &quot; + ex.Message,\n                    &quot;Upload Error&quot;,\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Error);\n            }\n        }\n    }\n}</code></pre></div>"},{"title":"Auto Password Generator","body":"**Project type:** C# Windows Forms\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Security.Cryptography;\nusing System.Windows.Forms;\n\nnamespace AutoPasswordGenerator\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private string GeneratePassword(int length)\n        {\n            const string chars =\n                \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\" +\n                \"abcdefghijklmnopqrstuvwxyz\" +\n                \"0123456789\" +\n                \"!@#$%^&*\";\n\n            char[] password = new char[length];\n\n            using (RandomNumberGenerator rng = RandomNumberGenerator.Create())\n            {\n                byte[] randomBytes = new byte[4];\n                int limit = (int.MaxValue / chars.Length) * chars.Length;\n                for (int i = 0; i < length; i++)\n                {\n                    int value;\n                    do\n                    {\n                        rng.GetBytes(randomBytes);\n                        value = BitConverter.ToInt32(randomBytes, 0) & 0x7fffffff;\n                    } while (value >= limit);\n                    password[i] = chars[value % chars.Length];\n                }\n            }\n\n            return new string(password);\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            if (textBox1.Text.Trim().Length == 0 || textBox2.Text.Trim().Length == 0)\n            {\n                MessageBox.Show(\n                    \"Please enter Name and Email.\",\n                    \"Registration\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n                return;\n            }\n\n            string password = GeneratePassword(10);\n            textBox3.Text = password;\n\n            MessageBox.Show(\n                \"Registration successful. Your generated password is displayed in the password field.\",\n                \"Registration\",\n                MessageBoxButtons.OK,\n                MessageBoxIcon.Information);\n        }\n    }\n}\n```","id":"dotnet-11","html":"<p><strong>Project type:</strong> C# Windows Forms</p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>using System;\nusing System.Security.Cryptography;\nusing System.Windows.Forms;\n\nnamespace AutoPasswordGenerator\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private string GeneratePassword(int length)\n        {\n            const string chars =\n                &quot;ABCDEFGHIJKLMNOPQRSTUVWXYZ&quot; +\n                &quot;abcdefghijklmnopqrstuvwxyz&quot; +\n                &quot;0123456789&quot; +\n                &quot;!@#$%^&amp;*&quot;;\n\n            char[] password = new char[length];\n\n            using (RandomNumberGenerator rng = RandomNumberGenerator.Create())\n            {\n                byte[] randomBytes = new byte[length];\n                rng.GetBytes(randomBytes);\n\n                for (int i = 0; i &lt; length; i++)\n                {\n                    password[i] = chars[randomBytes[i] % chars.Length];\n                }\n            }\n\n            return new string(password);\n        }\n\n        private void btnRegister_Click(object sender, EventArgs e)\n        {\n            if (txtName.Text == &quot;&quot; || txtEmail.Text == &quot;&quot;)\n            {\n                MessageBox.Show(\n                    &quot;Please enter Name and Email.&quot;,\n                    &quot;Registration&quot;,\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n                return;\n            }\n\n            string password = GeneratePassword(10);\n            txtPassword.Text = password;\n\n            MessageBox.Show(\n                &quot;Registration successful!\\nYour auto-generated password is:\\n&quot;\n                + password,\n                &quot;Registration&quot;,\n                MessageBoxButtons.OK,\n                MessageBoxIcon.Information);\n        }\n    }\n}</code></pre></div>"},{"title":"Customer Management System / Report Generation","body":"**Project type:** C# Windows Forms with SQL Server LocalDB (.NET Framework 4.6 / Visual Studio 2015 compatible).\n\n**Target:** Visual Studio 2015 / .NET Framework 4.6 compatible C# syntax.\n\nCreate a `Customer` table using the SQL below. On `Form1`, add `textBox1` through `textBox6`, `dataGridView1`, and buttons `button1` (Save), `button2` (Update), `button3` (Delete), `button4` (Clear), and `button5` (Report). On `Form2`, add `dataGridView1`, `label1` (customer count), and `label2` (total purchase amount). Wire each button to its matching `_Click` handler and wire `Form1_Load`, `Form2_Load`, and `dataGridView1_CellClick` in the Designer. Replace the database path in the connection string with the actual MDF path.\n\n**Database SQL:**\n\n```sql\nCREATE TABLE Customer (\n    CustomerName NVARCHAR(100) NOT NULL,\n    Address NVARCHAR(200),\n    City NVARCHAR(100),\n    Phone NVARCHAR(30) NOT NULL PRIMARY KEY,\n    Email NVARCHAR(150),\n    PurchaseAmount DECIMAL(12,2) NOT NULL DEFAULT 0\n);\n```\n\n**Form1.cs**\n\n```csharp\nusing System;\nusing System.Data;\nusing System.Data.SqlClient;\nusing System.Windows.Forms;\n\nnamespace CustomerManagement\n{\n    public partial class Form1 : Form\n    {\n        private readonly string connectionString = @\"Data Source=(LocalDB)\\MSSQLLocalDB;AttachDbFilename=C:\\PATH\\TO\\cust.mdf;Integrated Security=True;Connect Timeout=30\";\n\n        public Form1() { InitializeComponent(); }\n\n        private void Form1_Load(object sender, EventArgs e) { LoadCustomers(); }\n\n        private void LoadCustomers()\n        {\n            try\n            {\n                using (SqlConnection connection = new SqlConnection(connectionString))\n                using (SqlDataAdapter adapter = new SqlDataAdapter(\"SELECT CustomerName, Address, City, Phone, Email, PurchaseAmount FROM Customer\", connection))\n                {\n                    DataTable table = new DataTable();\n                    adapter.Fill(table);\n                    dataGridView1.DataSource = table;\n                }\n            }\n            catch (Exception ex) { MessageBox.Show(\"Could not load customers: \" + ex.Message); }\n        }\n\n        private bool ValidateFields(out decimal amount)\n        {\n            amount = 0;\n            if (textBox1.Text.Trim() == \"\" || textBox4.Text.Trim() == \"\")\n            {\n                MessageBox.Show(\"Customer name and phone are required.\"); return false;\n            }\n            if (!decimal.TryParse(textBox6.Text, out amount) || amount < 0)\n            {\n                MessageBox.Show(\"Enter a valid non-negative purchase amount.\"); return false;\n            }\n            return true;\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            decimal amount; if (!ValidateFields(out amount)) return;\n            try\n            {\n                using (SqlConnection connection = new SqlConnection(connectionString))\n                using (SqlCommand command = new SqlCommand(\"INSERT INTO Customer (CustomerName, Address, City, Phone, Email, PurchaseAmount) VALUES (@name,@address,@city,@phone,@email,@amount)\", connection))\n                {\n                    AddParameters(command, amount); connection.Open(); command.ExecuteNonQuery();\n                }\n                LoadCustomers(); ClearFields(); MessageBox.Show(\"Customer saved.\");\n            }\n            catch (Exception ex) { MessageBox.Show(\"Save failed: \" + ex.Message); }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            decimal amount; if (!ValidateFields(out amount)) return;\n            try\n            {\n                using (SqlConnection connection = new SqlConnection(connectionString))\n                using (SqlCommand command = new SqlCommand(\"UPDATE Customer SET CustomerName=@name, Address=@address, City=@city, Email=@email, PurchaseAmount=@amount WHERE Phone=@phone\", connection))\n                {\n                    AddParameters(command, amount); connection.Open();\n                    if (command.ExecuteNonQuery() == 0) MessageBox.Show(\"No customer found for that phone number.\");\n                }\n                LoadCustomers();\n            }\n            catch (Exception ex) { MessageBox.Show(\"Update failed: \" + ex.Message); }\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            if (textBox4.Text.Trim() == \"\") { MessageBox.Show(\"Enter/select the customer's phone number.\"); return; }\n            try\n            {\n                using (SqlConnection connection = new SqlConnection(connectionString))\n                using (SqlCommand command = new SqlCommand(\"DELETE FROM Customer WHERE Phone=@phone\", connection))\n                {\n                    command.Parameters.AddWithValue(\"@phone\", textBox4.Text.Trim()); connection.Open();\n                    if (command.ExecuteNonQuery() == 0) MessageBox.Show(\"No customer found for that phone number.\");\n                }\n                LoadCustomers(); ClearFields();\n            }\n            catch (Exception ex) { MessageBox.Show(\"Delete failed: \" + ex.Message); }\n        }\n\n        private void AddParameters(SqlCommand command, decimal amount)\n        {\n            command.Parameters.AddWithValue(\"@name\", textBox1.Text.Trim());\n            command.Parameters.AddWithValue(\"@address\", textBox2.Text.Trim());\n            command.Parameters.AddWithValue(\"@city\", textBox3.Text.Trim());\n            command.Parameters.AddWithValue(\"@phone\", textBox4.Text.Trim());\n            command.Parameters.AddWithValue(\"@email\", textBox5.Text.Trim());\n            command.Parameters.AddWithValue(\"@amount\", amount);\n        }\n\n        private void button4_Click(object sender, EventArgs e) { ClearFields(); }\n        private void ClearFields()\n        {\n            textBox1.Clear(); textBox2.Clear(); textBox3.Clear(); textBox4.Clear(); textBox5.Clear(); textBox6.Clear();\n        }\n\n        private void dataGridView1_CellClick(object sender, DataGridViewCellEventArgs e)\n        {\n            if (e.RowIndex < 0) return;\n            DataGridViewRow row = dataGridView1.Rows[e.RowIndex];\n            textBox1.Text = Convert.ToString(row.Cells[\"CustomerName\"].Value);\n            textBox2.Text = Convert.ToString(row.Cells[\"Address\"].Value);\n            textBox3.Text = Convert.ToString(row.Cells[\"City\"].Value);\n            textBox4.Text = Convert.ToString(row.Cells[\"Phone\"].Value);\n            textBox5.Text = Convert.ToString(row.Cells[\"Email\"].Value);\n            textBox6.Text = Convert.ToString(row.Cells[\"PurchaseAmount\"].Value);\n        }\n\n        private void button5_Click(object sender, EventArgs e) { using (Form2 report = new Form2(connectionString)) report.ShowDialog(this); }\n    }\n}\n```\n\n**Form2.cs**\n\n```csharp\nusing System;\nusing System.Data;\nusing System.Data.SqlClient;\nusing System.Windows.Forms;\n\nnamespace CustomerManagement\n{\n    public partial class Form2 : Form\n    {\n        private readonly string connectionString;\n        public Form2(string connectionString) { InitializeComponent(); this.connectionString = connectionString; }\n\n        private void Form2_Load(object sender, EventArgs e)\n        {\n            try\n            {\n                using (SqlConnection connection = new SqlConnection(connectionString))\n                using (SqlDataAdapter adapter = new SqlDataAdapter(\"SELECT CustomerName, Address, City, Phone, Email, PurchaseAmount FROM Customer\", connection))\n                {\n                    DataTable table = new DataTable(); adapter.Fill(table); dataGridView1.DataSource = table;\n                    label1.Text = \"Total customers: \" + table.Rows.Count;\n                    decimal total = 0;\n                    foreach (DataRow row in table.Rows) if (row[\"PurchaseAmount\"] != DBNull.Value) total += Convert.ToDecimal(row[\"PurchaseAmount\"]);\n                    label2.Text = \"Total purchase amount: \" + total.ToString(\"0.00\");\n                }\n            }\n            catch (Exception ex) { MessageBox.Show(\"Report failed: \" + ex.Message); }\n        }\n    }\n}\n```\n\n**Important:** Ensure both forms are in the `CustomerManagement` namespace, wire the events exactly as listed, add the SQL Server LocalDB component, and replace `C:\\PATH\\TO\\cust.mdf`. The database and Designer files must exist in your Visual Studio project for this program to run.","id":"dotnet-12","html":"<p><strong>Project type:</strong> C# Windows Forms with SQL Server LocalDB</p>\n<p>The PDF contains two code-behind files, <code>Form1.cs</code> for customer CRUD operations and <code>Form2.cs</code> for the report. The version below corrects the visible field-mapping mistakes from the PDF: update uses <code>textBox4</code> for Phone and <code>textBox5</code> for Email, and delete uses <code>textBox4</code> for Phone. Change the database file path to the actual location of your <code>cust.mdf</code> file, and ensure the <code>Customer</code> table has the columns shown below.</p>\n<p>Expected TextBox mapping: <code>textBox1</code> CustomerName, <code>textBox2</code> Address, <code>textBox3</code> City, <code>textBox4</code> Phone, <code>textBox5</code> Email, <code>textBox6</code> PurchaseAmount.</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>sql</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>CREATE TABLE Customer (\n    CustomerName NVARCHAR(100) NOT NULL,\n    Address NVARCHAR(200),\n    City NVARCHAR(100),\n    Phone NVARCHAR(30) NOT NULL PRIMARY KEY,\n    Email NVARCHAR(150),\n    PurchaseAmount DECIMAL(12,2) NOT NULL DEFAULT 0\n);</code></pre></div>\n<p>Use a connection string appropriate to the local project, for example:</p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp</span><button class=\"copy-btn\" type=\"button\">Copy code</button></div><pre><code>string connectionString =\n    @&quot;Data Source=(LocalDB)\\MSSQLLocalDB;AttachDbFilename=C:\\PATH\\TO\\cust.mdf;Integrated Security=True;Connect Timeout=30&quot;;</code></pre></div>\n<p>The original PDF's <code>Form1.cs</code> includes these operations: load customers into <code>dataGridView1</code>, save a customer, select a row to populate the text boxes, update by Phone, delete by Phone, clear fields, and open <code>Form2</code> for reporting. <code>Form2.cs</code> loads the customer table, displays the total customer count, and sums <code>PurchaseAmount</code>.</p>\n<p><strong>Important:</strong> Replace <code>C:\\PATH\\TO\\cust.mdf</code> with your real database path. Ensure the Designer files contain <code>dataGridView1</code>, <code>textBox1</code> through <code>textBox6</code>, the buttons, and the report form's <code>dataGridView1</code>, <code>label1</code>, and <code>label2</code>, with event handlers wired. The PDF does not include the database file or Designer files, so the full application cannot be verified from the PDF alone.</p>"}]};

function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function getAimAlgorithm(key,title,body){
  const match=String(title).toLowerCase();
  const index=programs[key].findIndex(p=>p.title===title);
  const data=(aimAlgorithmData[key]||[])[index];
  if(data)return {aim:data[0],steps:data[1]};
  return {aim:'Demonstrate '+title+' using '+'a C# application.',steps:['Start the program or application.','Read and validate the required input.','Perform the operations required for '+title+'.','Display the result to the user.','Handle invalid input or errors and finish the program.']};
}
function render(key){
  const list=document.getElementById(key+'List');list.innerHTML='';
  programs[key].forEach((p,i)=>{
    const details=document.createElement('details');details.className='program';details.dataset.search=(p.title+' '+p.body).toLowerCase();
    const summary=document.createElement('summary');summary.innerHTML='<span class="number">'+String(i+1).padStart(2,'0')+'</span><span class="program-name"></span><span class="chevron">⌄</span>';summary.querySelector('.program-name').textContent=p.title;
    const body=document.createElement('div');body.className='program-body';const aa=getAimAlgorithm(key,p.title,p.body);
    const match=p.body.match(/```[^\n]*\n([\s\S]*?)```/);const code=match?match[1].replace(/\n+$/,''):'Code sample is not available in the source for this program.';
    const filename=(p.body.match(/Filename: `([^`]+)`/)||[])[1]||('Program'+(i+1)+'.cs');
    body.innerHTML='<div class="aim-algorithm">'+
      '<section class="aa-section"><button class="aa-copy" type="button" data-copy-target="aim-'+p.id+'">Copy</button><h3>Aim</h3><div class="aa-scroll"><p id="aim-'+p.id+'">'+escapeHtml(aa.aim)+'</p></div></section>'+
      '<section class="aa-section"><button class="aa-copy" type="button" data-copy-target="algorithm-'+p.id+'">Copy</button><h3>Algorithm</h3><div class="aa-scroll"><ol id="algorithm-'+p.id+'">'+aa.steps.map(step=>'<li>'+escapeHtml(step)+'</li>').join('')+'</ol></div></section>'+
      '<section class="code-card"><div class="code-card-head"><h3>Code <span style="color:#777;font-weight:400;text-transform:none">/ '+escapeHtml(filename)+'</span></h3><div class="code-actions"><button class="copy-btn copy-full" type="button" data-copy-full>Copy full answer</button><button class="copy-btn" type="button" data-copy-code>Copy code</button></div></div><div class="code-scroll"><pre><code>'+escapeHtml(code)+'</code></pre></div><div class="copy-status" aria-live="polite"></div></section></div>';
    details.append(summary,body);list.append(details);
  });
}
render('dotnet');
function openSubject(key){home.style.display='none';document.querySelectorAll('.workspace').forEach(w=>w.classList.remove('active'));document.getElementById(key+'Workspace').classList.add('active');window.scrollTo(0,0)}
function goHome(){home.style.display='block';document.querySelectorAll('.workspace').forEach(w=>w.classList.remove('active'));window.scrollTo(0,0)}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openSubject(b.dataset.open)));document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',goHome));
document.querySelectorAll('[data-expand]').forEach(b=>b.addEventListener('click',()=>document.querySelectorAll('#'+b.dataset.expand+'List details').forEach(d=>{if(d.style.display!=='none')d.open=true})));document.querySelectorAll('[data-collapse]').forEach(b=>b.addEventListener('click',()=>document.querySelectorAll('#'+b.dataset.collapse+'List details').forEach(d=>d.open=false)));
document.querySelectorAll('[data-search]').forEach(input=>input.addEventListener('input',()=>{const key=input.dataset.search;const q=input.value.toLowerCase().trim();let count=0;document.querySelectorAll('#'+key+'List .program').forEach(d=>{const show=d.dataset.search.includes(q);d.style.display=show?'':'none';if(show)count++});document.getElementById(key+'Empty').style.display=count?'none':'block'}));
document.addEventListener('click',async e=>{
 const b=e.target.closest('.copy-btn,.aa-copy');if(!b)return;
 const program=b.closest('.program');let text='';
 if(b.classList.contains('aa-copy')){
   const target=document.getElementById(b.dataset.copyTarget);
   text=target.tagName==='OL'?Array.from(target.querySelectorAll('li')).map((li,i)=>(i+1)+'. '+li.innerText).join('\n'):target.innerText;
 }else if(b.hasAttribute('data-copy-full')){
   const aim=program.querySelector('[id^="aim-"]').innerText;
   const algorithm=Array.from(program.querySelectorAll('[id^="algorithm-"] li')).map((li,i)=>(i+1)+'. '+li.innerText).join('\n');
   const code=program.querySelector('.code-card pre code').innerText;
   text='AIM\n'+aim+'\n\nALGORITHM\n'+algorithm+'\n\nCODE\n'+code;
 }else{
   text=b.closest('.code-card')?.querySelector('pre code')?.innerText || b.closest('.code-wrap')?.querySelector('pre code')?.innerText || '';
 }
 try{
   if(!text) throw new Error('Nothing to copy');
   let copied=false;
   // Clipboard API can exist but still reject on local files or restricted browser contexts.
   if(navigator.clipboard && typeof navigator.clipboard.writeText==='function'){
     try { await navigator.clipboard.writeText(text); copied=true; } catch(clipboardError) { copied=false; }
   }
   // Legacy fallback for file:// pages and browsers without clipboard permission.
   if(!copied){
     const ta=document.createElement('textarea');
     ta.value=text; ta.setAttribute('readonly','');
     ta.style.position='fixed'; ta.style.left='0'; ta.style.top='0';
     ta.style.width='2px'; ta.style.height='2px'; ta.style.padding='0'; ta.style.opacity='0.01';
     document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
     try { copied=document.execCommand('copy'); } finally { ta.remove(); }
   }
   if(!copied) throw new Error('Copy command was blocked');
   const original=b.hasAttribute('data-copy-full')?'Copy full answer':b.hasAttribute('data-copy-code')?'Copy code':b.classList.contains('aa-copy')?'Copy':'Copy code';
   b.textContent='Copied'; b.classList.add('copied');
   const status=b.closest('.code-card')?.querySelector('.copy-status');
   if(status) status.textContent=b.hasAttribute('data-copy-full')?'Aim, algorithm and code copied together.':'Copied to clipboard.';
   setTimeout(()=>{b.textContent=original;b.classList.remove('copied')},1400);
 }catch(err){
   const status=b.closest('.code-card')?.querySelector('.copy-status');
   if(status) status.textContent='Clipboard access was blocked. Select the code text and use your browser’s Copy command.';
   else if(b.classList.contains('aa-copy')) b.textContent='Select and copy manually';
 }
});
