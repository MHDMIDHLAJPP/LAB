<script>
const programs = {"linux": [{"title": "File Commands", "body": "Filename: `program1.sh`\n\n```bash\n#!/usr/bin/env bash\nset -u\n\nprintf 'Creating file1.txt...\\n'\ncat > file1.txt <<'EOF'\nLinux Shell Scripting\nOperating System\nFile Commands\nEOF\n\nprintf '\\nContents of file1.txt:\\n'\ncat file1.txt\n\nprintf '\\nCopying file1.txt to file2.txt...\\n'\ncp file1.txt file2.txt\nprintf 'Moving file2.txt to moved.txt...\\n'\nmv file2.txt moved.txt\n\nprintf '\\nComparing file1.txt and moved.txt:\\n'\nif cmp -s file1.txt moved.txt; then\n  echo 'Both files are identical.'\nelse\n  echo 'Files are different.'\nfi\n\nprintf '\\nWord, line and character count:\\n'\nwc file1.txt\n\nprintf '\\nSplitting file1.txt:\\n'\nsplit -l 1 file1.txt part_\nprintf 'Split files:\\n'\nls part_*\n\ncat > file3.txt <<'EOF'\nLinux Shell Scripting\nOperating System\nUnix Commands\nEOF\nprintf '\\nDifference between file1.txt and file3.txt:\\n'\ndiff -u file1.txt file3.txt || true\n\nprintf '\\nRemoving temporary files...\\n'\nrm -f moved.txt file3.txt part_*\necho 'Temporary files removed successfully.'\n```", "id": "linux-1", "html": "<p>Filename: <code>program1.sh<\/code><\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>bash<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>#!/usr/bin/env bash\nset -u\n\nprintf &#x27;Creating file1.txt...\\n&#x27;\ncat &gt; file1.txt &lt;&lt;&#x27;EOF&#x27;\nLinux Shell Scripting\nOperating System\nFile Commands\nEOF\n\nprintf &#x27;\\nContents of file1.txt:\\n&#x27;\ncat file1.txt\n\nprintf &#x27;\\nCopying file1.txt to file2.txt...\\n&#x27;\ncp file1.txt file2.txt\nprintf &#x27;Moving file2.txt to moved.txt...\\n&#x27;\nmv file2.txt moved.txt\n\nprintf &#x27;\\nComparing file1.txt and moved.txt:\\n&#x27;\nif cmp -s file1.txt moved.txt; then\n  echo &#x27;Both files are identical.&#x27;\nelse\n  echo &#x27;Files are different.&#x27;\nfi\n\nprintf &#x27;\\nWord, line and character count:\\n&#x27;\nwc file1.txt\n\nprintf &#x27;\\nSplitting file1.txt:\\n&#x27;\nsplit -l 1 file1.txt part_\nprintf &#x27;Split files:\\n&#x27;\nls part_*\n\ncat &gt; file3.txt &lt;&lt;&#x27;EOF&#x27;\nLinux Shell Scripting\nOperating System\nUnix Commands\nEOF\nprintf &#x27;\\nDifference between file1.txt and file3.txt:\\n&#x27;\ndiff -u file1.txt file3.txt || true\n\nprintf &#x27;\\nRemoving temporary files...\\n&#x27;\nrm -f moved.txt file3.txt part_*\necho &#x27;Temporary files removed successfully.&#x27;<\/code><\/pre><\/div>"}, {"title": "Displaying System Configuration", "body": "Filename: `program2.sh`\n\n```bash\n#!/usr/bin/env bash\n\nprintf '%s\\n' '=== SYSTEM CONFIGURATION ==='\necho 'Currently logged-in user:'\nwhoami\n\necho '\\nLogin information:'\nwho\n\necho '\\nCurrent shell:'\necho \"$SHELL\"\n\necho '\\nHome directory:'\necho \"$HOME\"\n\necho '\\nOperating system:'\nuname -o 2>/dev/null || uname -s\n\necho '\\nKernel information:'\nuname -a\n\necho '\\nCurrent PATH:'\necho \"$PATH\"\n\necho '\\nCurrent working directory:'\npwd\n\necho '\\nNumber of logged-in users/sessions:'\nwho | wc -l\n\necho '\\nAvailable shells:'\ncat /etc/shells\n\necho '\\nCPU information:'\nlscpu | grep -E 'Model name|^CPU\\(s\\):|CPU MHz' || true\n\necho '\\nMemory information:'\nfree -h\n```", "id": "linux-2", "html": "<p>Filename: <code>program2.sh<\/code><\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>bash<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>#!/usr/bin/env bash\n\nprintf &#x27;%s\\n&#x27; &#x27;=== SYSTEM CONFIGURATION ===&#x27;\necho &#x27;Currently logged-in user:&#x27;\nwhoami\n\necho &#x27;\\nLogin information:&#x27;\nwho\n\necho &#x27;\\nCurrent shell:&#x27;\necho &quot;$SHELL&quot;\n\necho &#x27;\\nHome directory:&#x27;\necho &quot;$HOME&quot;\n\necho &#x27;\\nOperating system:&#x27;\nuname -o 2&gt;/dev/null || uname -s\n\necho &#x27;\\nKernel information:&#x27;\nuname -a\n\necho &#x27;\\nCurrent PATH:&#x27;\necho &quot;$PATH&quot;\n\necho &#x27;\\nCurrent working directory:&#x27;\npwd\n\necho &#x27;\\nNumber of logged-in users/sessions:&#x27;\nwho | wc -l\n\necho &#x27;\\nAvailable shells:&#x27;\ncat /etc/shells\n\necho &#x27;\\nCPU information:&#x27;\nlscpu | grep -E &#x27;Model name|^CPU\\(s\\):|CPU MHz&#x27; || true\n\necho &#x27;\\nMemory information:&#x27;\nfree -h<\/code><\/pre><\/div>"}, {"title": "Pipes, Redirection and Tee Commands", "body": "Filename: `program3.sh`\n\n```bash\n#!/usr/bin/env bash\n\nprintf 'Linux Shell Commands\\n' > input.txt\nprintf 'Operating System\\n' >> input.txt\nprintf 'Shell Scripting\\n' >> input.txt\n\necho '===== Input file (using input redirection) ====='\ncat < input.txt\n\necho '\\n===== Pipe example: line count ====='\ncat input.txt | wc -l\n\necho '\\n===== Pipe with sort ====='\ncat input.txt | sort\n\necho '\\n===== Tee command ====='\ncat input.txt | tee output.txt\n\necho '\\n===== Redirected word count ====='\nwc -w < input.txt\n\necho 'Output saved in output.txt'\n```", "id": "linux-3", "html": "<p>Filename: <code>program3.sh<\/code><\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>bash<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>#!/usr/bin/env bash\n\nprintf &#x27;Linux Shell Commands\\n&#x27; &gt; input.txt\nprintf &#x27;Operating System\\n&#x27; &gt;&gt; input.txt\nprintf &#x27;Shell Scripting\\n&#x27; &gt;&gt; input.txt\n\necho &#x27;===== Input file (using input redirection) =====&#x27;\ncat &lt; input.txt\n\necho &#x27;\\n===== Pipe example: line count =====&#x27;\ncat input.txt | wc -l\n\necho &#x27;\\n===== Pipe with sort =====&#x27;\ncat input.txt | sort\n\necho &#x27;\\n===== Tee command =====&#x27;\ncat input.txt | tee output.txt\n\necho &#x27;\\n===== Redirected word count =====&#x27;\nwc -w &lt; input.txt\n\necho &#x27;Output saved in output.txt&#x27;<\/code><\/pre><\/div>"}, {"title": "Menu-Driven Shell Script", "body": "Filename: `program4.sh`\n\n```bash\n#!/usr/bin/env bash\n\nwhile true; do\n  echo '========== MENU =========='\n  echo '1. Display Current Date'\n  echo '2. Display User Name'\n  echo '3. Display File Listing'\n  echo '4. Display Directories'\n  echo '5. Exit'\n  echo '=========================='\n  read -r -p 'Enter your choice: ' choice\n\n  case \"$choice\" in\n    1) echo 'Current Date and Time:'; date ;;\n    2) echo 'Current User:'; whoami ;;\n    3) echo 'File Listing:'; ls -l ;;\n    4) echo 'Directories:'; find . -mindepth 1 -maxdepth 1 -type d -print ;;\n    5) echo 'Exiting...'; break ;;\n    *) echo 'Invalid choice!' ;;\n  esac\ndone\n```", "id": "linux-4", "html": "<p>Filename: <code>program4.sh<\/code><\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>bash<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>#!/usr/bin/env bash\n\nwhile true; do\n  echo &#x27;========== MENU ==========&#x27;\n  echo &#x27;1. Display Current Date&#x27;\n  echo &#x27;2. Display User Name&#x27;\n  echo &#x27;3. Display File Listing&#x27;\n  echo &#x27;4. Display Directories&#x27;\n  echo &#x27;5. Exit&#x27;\n  echo &#x27;==========================&#x27;\n  read -r -p &#x27;Enter your choice: &#x27; choice\n\n  case &quot;$choice&quot; in\n    1) echo &#x27;Current Date and Time:&#x27;; date ;;\n    2) echo &#x27;Current User:&#x27;; whoami ;;\n    3) echo &#x27;File Listing:&#x27;; ls -l ;;\n    4) echo &#x27;Directories:&#x27;; find . -mindepth 1 -maxdepth 1 -type d -print ;;\n    5) echo &#x27;Exiting...&#x27;; break ;;\n    *) echo &#x27;Invalid choice!&#x27; ;;\n  esac\ndone<\/code><\/pre><\/div>"}, {"title": "Filter Commands", "body": "Filename: `program5.sh`\n\n```bash\n#!/usr/bin/env bash\n\ncat > students.txt <<'EOF'\n101:Arun:85\n102:Bala:72\n103:Arun:85\n104:Divya:90\n105:Kiran:78\nEOF\n\necho '===== Original Data ====='\ncat students.txt\n\necho '\\n===== grep ====='\ngrep 'Arun' students.txt\n\necho '\\n===== sort ====='\nsort students.txt\n\necho '\\n===== uniq (after sorting) ====='\nsort students.txt | uniq\n\necho '\\n===== head ====='\nhead -n 2 students.txt\n\necho '\\n===== tail ====='\ntail -n 2 students.txt\n\necho '\\n===== cut ====='\ncut -d: -f2 students.txt\n\necho '\\n===== tr ====='\ntr 'a-z' 'A-Z' < students.txt\n\necho '\\n===== wc ====='\nwc students.txt\n```", "id": "linux-5", "html": "<p>Filename: <code>program5.sh<\/code><\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>bash<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>#!/usr/bin/env bash\n\ncat &gt; students.txt &lt;&lt;&#x27;EOF&#x27;\n101:Arun:85\n102:Bala:72\n103:Arun:85\n104:Divya:90\n105:Kiran:78\nEOF\n\necho &#x27;===== Original Data =====&#x27;\ncat students.txt\n\necho &#x27;\\n===== grep =====&#x27;\ngrep &#x27;Arun&#x27; students.txt\n\necho &#x27;\\n===== sort =====&#x27;\nsort students.txt\n\necho &#x27;\\n===== uniq (after sorting) =====&#x27;\nsort students.txt | uniq\n\necho &#x27;\\n===== head =====&#x27;\nhead -n 2 students.txt\n\necho &#x27;\\n===== tail =====&#x27;\ntail -n 2 students.txt\n\necho &#x27;\\n===== cut =====&#x27;\ncut -d: -f2 students.txt\n\necho &#x27;\\n===== tr =====&#x27;\ntr &#x27;a-z&#x27; &#x27;A-Z&#x27; &lt; students.txt\n\necho &#x27;\\n===== wc =====&#x27;\nwc students.txt<\/code><\/pre><\/div>"}, {"title": "Remove Zero-Byte Files", "body": "Filename: `program6.sh`\n\n```bash\n#!/usr/bin/env bash\n# WARNING: This removes empty regular files in the current directory.\n# Review the directory before running this script.\n\nfound=0\necho 'Checking for zero-byte files in the current directory...'\n\nfor file in ./*; do\n  [ -f \"$file\" ] || continue\n  if [ ! -s \"$file\" ]; then\n    echo \"Removing: ${file#./}\"\n    rm -- \"$file\"\n    found=1\n  fi\ndone\n\nif [ \"$found\" -eq 0 ]; then\n  echo 'No zero-byte files found.'\nelse\n  echo 'Zero-byte files removed successfully.'\nfi\n```", "id": "linux-6", "html": "<p>Filename: <code>program6.sh<\/code><\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>bash<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>#!/usr/bin/env bash\n# WARNING: This removes empty regular files in the current directory.\n# Review the directory before running this script.\n\nfound=0\necho &#x27;Checking for zero-byte files in the current directory...&#x27;\n\nfor file in ./*; do\n  [ -f &quot;$file&quot; ] || continue\n  if [ ! -s &quot;$file&quot; ]; then\n    echo &quot;Removing: ${file#./}&quot;\n    rm -- &quot;$file&quot;\n    found=1\n  fi\ndone\n\nif [ &quot;$found&quot; -eq 0 ]; then\n  echo &#x27;No zero-byte files found.&#x27;\nelse\n  echo &#x27;Zero-byte files removed successfully.&#x27;\nfi<\/code><\/pre><\/div>"}, {"title": "Sum of Individual Digits", "body": "Filename: `program7.sh`\n\n```bash\n#!/usr/bin/env bash\n\nread -r -p 'Enter a non-negative integer: ' num\nif [[ ! \"$num\" =~ ^[0-9]+$ ]]; then\n  echo 'Invalid input. Enter a non-negative integer.'\n  exit 1\nfi\n\ntemp=$num\nsum=0\nwhile [ \"$temp\" -gt 0 ]; do\n  digit=$((temp % 10))\n  sum=$((sum + digit))\n  temp=$((temp / 10))\ndone\n\necho \"Sum of individual digits = $sum\"\n```", "id": "linux-7", "html": "<p>Filename: <code>program7.sh<\/code><\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>bash<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>#!/usr/bin/env bash\n\nread -r -p &#x27;Enter a non-negative integer: &#x27; num\nif [[ ! &quot;$num&quot; =~ ^[0-9]+$ ]]; then\n  echo &#x27;Invalid input. Enter a non-negative integer.&#x27;\n  exit 1\nfi\n\ntemp=$num\nsum=0\nwhile [ &quot;$temp&quot; -gt 0 ]; do\n  digit=$((temp % 10))\n  sum=$((sum + digit))\n  temp=$((temp / 10))\ndone\n\necho &quot;Sum of individual digits = $sum&quot;<\/code><\/pre><\/div>"}, {"title": "Checking Whether a Number Is a Palindrome", "body": "Filename: `program8.sh`\n\n```bash\n#!/usr/bin/env bash\n\nread -r -p 'Enter a non-negative integer: ' num\nif [[ ! \"$num\" =~ ^[0-9]+$ ]]; then\n  echo 'Invalid input. Enter a non-negative integer.'\n  exit 1\nfi\n\noriginal=$num\ntemp=$num\nreverse=0\nwhile [ \"$temp\" -gt 0 ]; do\n  digit=$((temp % 10))\n  reverse=$((reverse * 10 + digit))\n  temp=$((temp / 10))\ndone\n\nif [ \"$original\" -eq \"$reverse\" ]; then\n  echo \"$original is a palindrome.\"\nelse\n  echo \"$original is not a palindrome.\"\nfi\n```", "id": "linux-8", "html": "<p>Filename: <code>program8.sh<\/code><\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>bash<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>#!/usr/bin/env bash\n\nread -r -p &#x27;Enter a non-negative integer: &#x27; num\nif [[ ! &quot;$num&quot; =~ ^[0-9]+$ ]]; then\n  echo &#x27;Invalid input. Enter a non-negative integer.&#x27;\n  exit 1\nfi\n\noriginal=$num\ntemp=$num\nreverse=0\nwhile [ &quot;$temp&quot; -gt 0 ]; do\n  digit=$((temp % 10))\n  reverse=$((reverse * 10 + digit))\n  temp=$((temp / 10))\ndone\n\nif [ &quot;$original&quot; -eq &quot;$reverse&quot; ]; then\n  echo &quot;$original is a palindrome.&quot;\nelse\n  echo &quot;$original is not a palindrome.&quot;\nfi<\/code><\/pre><\/div>"}], "dotnet": [{"title": "Employee Payroll", "body": "**Project type:** C# Console Application\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\n\nclass Employee\n{\n    public int EmpId;\n    public string Name;\n    public double BasicSalary;\n    public double DA;\n    public double HRA;\n    public double PF;\n    public double GrossSalary;\n    public double NetSalary;\n\n    public void CalculateSalary()\n    {\n        DA = BasicSalary * 0.10;   // 10% DA\n        HRA = BasicSalary * 0.20; // 20% HRA\n        PF = BasicSalary * 0.12;   // 12% PF\n        GrossSalary = BasicSalary + DA + HRA;\n        NetSalary = GrossSalary - PF;\n    }\n\n    public void Display()\n    {\n        Console.WriteLine(\"\\nEmployee Payroll Details\");\n        Console.WriteLine(\"-----------------------\");\n        Console.WriteLine(\"Employee ID : \" + EmpId);\n        Console.WriteLine(\"Name         : \" + Name);\n        Console.WriteLine(\"Basic Salary : \" + BasicSalary);\n        Console.WriteLine(\"DA           : \" + DA);\n        Console.WriteLine(\"HRA          : \" + HRA);\n        Console.WriteLine(\"PF           : \" + PF);\n        Console.WriteLine(\"Gross Salary : \" + GrossSalary);\n        Console.WriteLine(\"Net Salary   : \" + NetSalary);\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Employee emp = new Employee();\n\n        Console.Write(\"Enter Employee ID: \");\n        emp.EmpId = Convert.ToInt32(Console.ReadLine());\n\n        Console.Write(\"Enter Employee Name: \");\n        emp.Name = Console.ReadLine();\n\n        Console.Write(\"Enter Basic Salary: \");\n        emp.BasicSalary = Convert.ToDouble(Console.ReadLine());\n\n        emp.CalculateSalary();\n        emp.Display();\n\n        Console.ReadLine();\n    }\n}\n```", "id": "dotnet-1", "html": "<p><strong>Project type:<\/strong> C# Console Application<\/p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>using System;\n\nclass Employee\n{\n    public int EmpId;\n    public string Name;\n    public double BasicSalary;\n    public double DA;\n    public double HRA;\n    public double PF;\n    public double GrossSalary;\n    public double NetSalary;\n\n    public void CalculateSalary()\n    {\n        DA = BasicSalary * 0.10;   // 10% DA\n        HRA = BasicSalary * 0.20; // 20% HRA\n        PF = BasicSalary * 0.12;   // 12% PF\n        GrossSalary = BasicSalary + DA + HRA;\n        NetSalary = GrossSalary - PF;\n    }\n\n    public void Display()\n    {\n        Console.WriteLine(&quot;\\nEmployee Payroll Details&quot;);\n        Console.WriteLine(&quot;-----------------------&quot;);\n        Console.WriteLine(&quot;Employee ID : &quot; + EmpId);\n        Console.WriteLine(&quot;Name         : &quot; + Name);\n        Console.WriteLine(&quot;Basic Salary : &quot; + BasicSalary);\n        Console.WriteLine(&quot;DA           : &quot; + DA);\n        Console.WriteLine(&quot;HRA          : &quot; + HRA);\n        Console.WriteLine(&quot;PF           : &quot; + PF);\n        Console.WriteLine(&quot;Gross Salary : &quot; + GrossSalary);\n        Console.WriteLine(&quot;Net Salary   : &quot; + NetSalary);\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Employee emp = new Employee();\n\n        Console.Write(&quot;Enter Employee ID: &quot;);\n        emp.EmpId = Convert.ToInt32(Console.ReadLine());\n\n        Console.Write(&quot;Enter Employee Name: &quot;);\n        emp.Name = Console.ReadLine();\n\n        Console.Write(&quot;Enter Basic Salary: &quot;);\n        emp.BasicSalary = Convert.ToDouble(Console.ReadLine());\n\n        emp.CalculateSalary();\n        emp.Display();\n\n        Console.ReadLine();\n    }\n}<\/code><\/pre><\/div>"}, {"title": "Bank Application", "body": "**Project type:** C# Console Application\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nclass Program\n{\n    static void Main()\n    {\n        double balance = 1000;\n        int choice;\n        do\n        {\n            Console.WriteLine(\"\\n--- BANK APPLICATION ---\");\n            Console.WriteLine(\"1. Check Balance\");\n            Console.WriteLine(\"2. Deposit\");\n            Console.WriteLine(\"3. Withdraw\");\n            Console.WriteLine(\"4. Exit\");\n            Console.Write(\"Enter choice: \");\n            choice = Convert.ToInt32(Console.ReadLine());\n            switch (choice)\n            {\n                case 1:\n                    Console.WriteLine(\"Balance = ₹\" + balance);\n                    break;\n                case 2:\n                    Console.Write(\"Enter deposit amount: \");\n                    double deposit = Convert.ToDouble(Console.ReadLine());\n                    balance = balance + deposit;\n                    Console.WriteLine(\"Deposit successful\");\n                    break;\n                case 3:\n                    Console.Write(\"Enter withdraw amount: \");\n                    double withdraw = Convert.ToDouble(Console.ReadLine());\n                    if (withdraw <= balance)\n                    {\n                         balance = balance - withdraw;\n                         Console.WriteLine(\"Withdrawal successful\");\n                    }\n                    else\n                    {\n                         Console.WriteLine(\"Insufficient balance\");\n                    }\n                    break;\n                case 4:\n                    Console.WriteLine(\"Thank You!\");\n                    break;\n                default:\n                    Console.WriteLine(\"Invalid choice\");\n                    break;\n            }\n        } while (choice != 4);\n    }\n}\n```", "id": "dotnet-2", "html": "<p><strong>Project type:<\/strong> C# Console Application<\/p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>using System;\nclass Program\n{\n    static void Main()\n    {\n        double balance = 1000;\n        int choice;\n        do\n        {\n            Console.WriteLine(&quot;\\n--- BANK APPLICATION ---&quot;);\n            Console.WriteLine(&quot;1. Check Balance&quot;);\n            Console.WriteLine(&quot;2. Deposit&quot;);\n            Console.WriteLine(&quot;3. Withdraw&quot;);\n            Console.WriteLine(&quot;4. Exit&quot;);\n            Console.Write(&quot;Enter choice: &quot;);\n            choice = Convert.ToInt32(Console.ReadLine());\n            switch (choice)\n            {\n                case 1:\n                    Console.WriteLine(&quot;Balance = ₹&quot; + balance);\n                    break;\n                case 2:\n                    Console.Write(&quot;Enter deposit amount: &quot;);\n                    double deposit = Convert.ToDouble(Console.ReadLine());\n                    balance = balance + deposit;\n                    Console.WriteLine(&quot;Deposit successful&quot;);\n                    break;\n                case 3:\n                    Console.Write(&quot;Enter withdraw amount: &quot;);\n                    double withdraw = Convert.ToDouble(Console.ReadLine());\n                    if (withdraw &lt;= balance)\n                    {\n                         balance = balance - withdraw;\n                         Console.WriteLine(&quot;Withdrawal successful&quot;);\n                    }\n                    else\n                    {\n                         Console.WriteLine(&quot;Insufficient balance&quot;);\n                    }\n                    break;\n                case 4:\n                    Console.WriteLine(&quot;Thank You!&quot;);\n                    break;\n                default:\n                    Console.WriteLine(&quot;Invalid choice&quot;);\n                    break;\n            }\n        } while (choice != 4);\n    }\n}<\/code><\/pre><\/div>"}, {"title": "General Knowledge Quiz", "body": "**Project type:** C# Windows Forms\n\nThis is based on the supplied PDF. It assumes the form contains `panel1` through `panel4`, `label7`, `timer1`, `textBox1` through `textBox5`, and the radio buttons shown in the form designer. The score fields are initialized to zero and parsed safely so unanswered fields do not crash the program.\n\n```csharp\nusing System;\nusing System.Windows.Forms;\n\nnamespace QUIZ\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void Form1_Load(object sender, EventArgs e)\n        {\n            panel1.Visible = false;\n            panel2.Visible = false;\n            panel3.Visible = false;\n            panel4.Visible = false;\n            textBox1.Visible = false;\n            textBox2.Visible = false;\n            textBox3.Visible = false;\n            textBox4.Visible = false;\n            textBox1.Text = textBox2.Text = textBox3.Text = textBox4.Text = \"0\";\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            timer1.Start();\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            timer1.Stop();\n        }\n\n        private void timer1_Tick(object sender, EventArgs e)\n        {\n            if (!int.TryParse(label7.Text, out int value)) value = 0;\n            value++;\n            label7.Text = value.ToString();\n\n            panel1.Visible = value < 10;\n            panel2.Visible = value >= 10 && value < 20;\n            panel3.Visible = value >= 20 && value < 30;\n            panel4.Visible = value >= 30 && value < 40;\n\n            if (value >= 40)\n            {\n                timer1.Stop();\n                MessageBox.Show(\"Time is up\");\n            }\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            textBox1.Visible = textBox2.Visible = textBox3.Visible = textBox4.Visible = true;\n            int score = ReadScore(textBox1.Text) + ReadScore(textBox2.Text)\n                      + ReadScore(textBox3.Text) + ReadScore(textBox4.Text);\n            textBox5.Text = score.ToString();\n        }\n\n        private static int ReadScore(string value)\n        {\n            return int.TryParse(value, out int score) ? score : 0;\n        }\n\n        private void radioButton2_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton2.Checked) textBox1.Text = \"1\";\n        }\n\n        private void radioButton7_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton7.Checked) textBox2.Text = \"1\";\n        }\n\n        private void radioButton11_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton11.Checked) textBox3.Text = \"1\";\n        }\n\n        private void radioButton16_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton16.Checked) textBox4.Text = \"1\";\n        }\n    }\n}\n```\n\n**Important:** This corrects empty-score parsing but still depends on the question controls and event handlers being connected in the Visual Studio Designer. Verify that the listed radio buttons correspond to the correct answers in the supplied quiz form.", "id": "dotnet-3", "html": "<p><strong>Project type:<\/strong> C# Windows Forms<\/p>\n<p>This is based on the supplied PDF. It assumes the form contains <code>panel1<\/code> through <code>panel4<\/code>, <code>label7<\/code>, <code>timer1<\/code>, <code>textBox1<\/code> through <code>textBox5<\/code>, and the radio buttons shown in the form designer. The score fields are initialized to zero and parsed safely so unanswered fields do not crash the program.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>using System;\nusing System.Windows.Forms;\n\nnamespace QUIZ\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void Form1_Load(object sender, EventArgs e)\n        {\n            panel1.Visible = false;\n            panel2.Visible = false;\n            panel3.Visible = false;\n            panel4.Visible = false;\n            textBox1.Visible = false;\n            textBox2.Visible = false;\n            textBox3.Visible = false;\n            textBox4.Visible = false;\n            textBox1.Text = textBox2.Text = textBox3.Text = textBox4.Text = &quot;0&quot;;\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            timer1.Start();\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            timer1.Stop();\n        }\n\n        private void timer1_Tick(object sender, EventArgs e)\n        {\n            if (!int.TryParse(label7.Text, out int value)) value = 0;\n            value++;\n            label7.Text = value.ToString();\n\n            panel1.Visible = value &lt; 10;\n            panel2.Visible = value &gt;= 10 &amp;&amp; value &lt; 20;\n            panel3.Visible = value &gt;= 20 &amp;&amp; value &lt; 30;\n            panel4.Visible = value &gt;= 30 &amp;&amp; value &lt; 40;\n\n            if (value &gt;= 40)\n            {\n                timer1.Stop();\n                MessageBox.Show(&quot;Time is up&quot;);\n            }\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            textBox1.Visible = textBox2.Visible = textBox3.Visible = textBox4.Visible = true;\n            int score = ReadScore(textBox1.Text) + ReadScore(textBox2.Text)\n                      + ReadScore(textBox3.Text) + ReadScore(textBox4.Text);\n            textBox5.Text = score.ToString();\n        }\n\n        private static int ReadScore(string value)\n        {\n            return int.TryParse(value, out int score) ? score : 0;\n        }\n\n        private void radioButton2_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton2.Checked) textBox1.Text = &quot;1&quot;;\n        }\n\n        private void radioButton7_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton7.Checked) textBox2.Text = &quot;1&quot;;\n        }\n\n        private void radioButton11_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton11.Checked) textBox3.Text = &quot;1&quot;;\n        }\n\n        private void radioButton16_CheckedChanged(object sender, EventArgs e)\n        {\n            if (radioButton16.Checked) textBox4.Text = &quot;1&quot;;\n        }\n    }\n}<\/code><\/pre><\/div>\n<p><strong>Important:<\/strong> This corrects empty-score parsing but still depends on the question controls and event handlers being connected in the Visual Studio Designer. Verify that the listed radio buttons correspond to the correct answers in the supplied quiz form.<\/p>"}, {"title": "Dialog Boxes (Font, Color, Open File, Save File)", "body": "**Project type:** C# Windows Forms\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace DIALOGBOX\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            FontDialog fontDialog = new FontDialog();\n            if (fontDialog.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.Font = fontDialog.Font;\n            }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            ColorDialog colorDialog = new ColorDialog();\n            if (colorDialog.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.ForeColor = colorDialog.Color;\n            }\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            OpenFileDialog openFileDialog = new OpenFileDialog();\n            openFileDialog.Filter =\n                \"Text Files (*.txt)|*.txt|All Files (*.*)|*.*\";\n            if (openFileDialog.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.Text =\n                    File.ReadAllText(openFileDialog.FileName);\n            }\n        }\n\n        private void button4_Click(object sender, EventArgs e)\n        {\n            SaveFileDialog saveFileDialog = new SaveFileDialog();\n            saveFileDialog.Filter =\n                \"Text Files (*.txt)|*.txt|All Files (*.*)|*.*\";\n            if (saveFileDialog.ShowDialog() == DialogResult.OK)\n            {\n                File.WriteAllText(\n                    saveFileDialog.FileName,\n                    richTextBox1.Text);\n                MessageBox.Show(\n                    \"File saved successfully.\",\n                    \"Save\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Information);\n            }\n        }\n    }\n}\n```", "id": "dotnet-4", "html": "<p><strong>Project type:<\/strong> C# Windows Forms<\/p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace DIALOGBOX\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            FontDialog fontDialog = new FontDialog();\n            if (fontDialog.ShowDialog() == DialogResult.OK)\n            {\n                richTextBox1.Font = fontDialog.Font;\n            }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            ColorDial dd Item\");\n            if (item != \"\")\n                listBox1.Items.Add(item);\n        }\n\n        private void btnSort_Click(object sender, EventArgs e)\n        {\n            listBox1.Sorted = true;\n        }\n\n        private void btnFind_Click(object sender, EventArgs e)\n        {\n            string item = Interaction.InputBox(\n                 \"Enter item to find:\", \"Find Item\");\n            int index = listBox1.FindString(item);\n            if (index >= 0)\n            {\n                 listBox1.SelectedIndex = index;\n                 MessageBox.Show(\"Item found.\");\n            }\n            else\n            {\n                 MessageBox.Show(\"Item not found.\");\n            }\n        }\n\n        private void btnCount_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\n                \"Total number of items: \" + listBox1.Items.Count);\n        }\n\n        private void btnSelect_Click(object sender, EventArgs e)\n        {\n            if (listBox1.SelectedIndex >= 0)\n            {\n                 MessageBox.Show(\n                     \"Selected Item: \" +\n                     listBox1.SelectedItem.ToString());\n            }\n            else\n            {\n                 MessageBox.Show(\"Please select an item.\");\n            }\n        }\n    }\n}\n```", "id": "dotnet-5", "html": "<p><strong>Project type:<\/strong> C# Windows Forms<\/p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>using System;\nusing System.Windows.Forms;\nusing Microsoft.VisualBasic;\n\nnamespace SortFindCountSelect\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void btnAdd_Click(object sender, EventArgs e)\n        {\n            string item = Interaction.InputBox(\n                &quot;Enter an item:&quot;, &quot;Add Item&quot;);\n            if (item != &quot;&quot;)\n                listBox1.Items.Add(item);\n        }\n\n        private void btnSort_Click(object sender, EventArgs e)\n        {\n            listBox1.Sorted = true;\n        }\n\n        private void btnFind_Click(object sender, EventArgs e)\n        {\n            string item = Interaction.InputBox(\n                 &quot;Enter item to find:&quot;, &quot;Find Item&quot;);\n            int index = listBox1.FindString(item);\n            if (index &gt;= 0)\n            {\n                 listBox1.SelectedIndex = index;\n                 MessageBox.Show(&quot;Item found.&quot;);\n            }\n            else\n            {\n                 MessageBox.Show(&quot;Item not found.&quot;);\n            }\n        }\n\n        private void btnCount_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\n                &quot;Total number of items: &quot; + listBox1.Items.Count);\n        }\n\n        private void btnSelect_Click(object sender, EventArgs e)\n        {\n            if (listBox1.SelectedIndex &gt;= 0)\n            {\n                 MessageBox.Show(\n                     &quot;Selected Item: &quot; +\n                     listBox1.SelectedItem.ToString());\n            }\n            else\n            {\n                 MessageBox.Show(&quot;Please select an item.&quot;);\n            }\n        }\n    }\n}<\/code><\/pre><\/div>"}, {"title": "Student Information and Age", "body": "**Project type:** C# Windows Forms\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace StudentInformation\n{\n    publ {\n                age--;\n            }\n\n            label5.Text = &quot;Register Number: &quot; + rollNo +\n                          &quot;\\nStudent Name: &quot; + name +\n                          &quot;\\nCourse: &quot; + course +\n                          &quot;\\nDate of Birth: &quot; + dob.ToString(&quot;dd-MM-yyyy&quot;) +\n                          &quot;\\nAge: &quot; + age + &quot; Years&quot;;\n        }\n    }\n}<\/code><\/pre><\/div>"}, {"title": "Bus Ticket Reservation (MDI)", "body": "**Project type:** C# Windows Forms\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace busticketreservation\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n           private void reservationToolStripMenuItem_Click(object sender,\n               EventArgs e)\n           {\n               Reservation r = new busticketreservation.Reservation();\n               r.MdiParent = this;\n               r.Show();\n           }\n\n           private void exitToolStripMenuItem_Click(object sender, EventArgs e)\n           {\n               Application.Exit();\n           }\n\n           private void busTicketReservationToolStripMenuItem_Click(object sender,\n               EventArgs e)\n           {\n           }\n    }\n}\n\n// Reservation.cs\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace busticketreservation\n{\n    public partial class Reservation : Form\n    {\n        public Reservation()\n        {\n            InitializeComponent();\n        }\n\n           private void button2_Click(object sender, EventArgs e)\n\n        {\n            textBox1.Clear();\n            textBox2.Clear();\n            comboBox1.SelectedIndex = -1;\n            comboBox2.SelectedIndex = -1;\n            comboBox3.SelectedIndex = -1;\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            if (textBox1.Text == \" \")\n                 MessageBox.Show(\"Enter Passengar Details\");\n            else\n                 MessageBox.Show(\"Ticket Booked Suuceesfully\");\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\"PASSENGAR:\" + textBox1.Text +\n                \"\\nFROM:\" + comboBox1.Text +\n                \"\\nTO:\" + comboBox2.Text +\n                \"\\nBUS TYPE:\" + comboBox3.Text +\n                \"\\nNO OF TICKETS:\" + textBox2.Text +\n                \"\\nJOURNEY DATE:\" + dateTimePicker1.Text);\n        }\n    }\n}\n```", "id": "dotnet-7", "html": "<p><strong>Project type:<\/strong> C# Windows Forms<\/p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace busticketreservation\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n           private void reservationToolStripMenuItem_Click(object sender,\n               EventArgs e)\n           {\n               Reservation r = new busticketreservation.Reservation();\n               r.MdiParent = this;\n               r.Show();\n           }\n\n           private void exitToolStripMenuItem_Click(object sender, EventArgs e)\n           {\n               Application.Exit();\n           }\n\n           private void busTicketReservationToolStripMenuItem_Click(object sender,\n               EventArgs e)\n           {\n           }\n    }\n}\n\n// Reservation.cs\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace busticketreservation\n{\n    public partial class Reservation : Form\n    {\n        public Reservation()\n        {\n            InitializeComponent();\n        }\n\n           private void button2_Click(object sender, EventArgs e)\n\n        {\n            textBox1.Clear();\n            textBox2.Clear();\n            comboBox1.SelectedIndex = -1;\n            comboBox2.SelectedIndex = -1;\n            comboBox3.SelectedIndex = -1;\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            if (textBox1.Text == &quot; &quot;)\n                 MessageBox.Show(&quot;Enter Passengar Details&quot;);\n            else\n                 MessageBox.Show(&quot;Ticket Booked Suuceesfully&quot;);\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(&quot;PASSENGAR:&quot; + textBox1.Text +\n                &quot;\\nFROM:&quot; + comboBox1.Text +\n                &quot;\\nTO:&quot; + comboBox2.Text +\n                &quot;\\nBUS TYPE:&quot; + comboBox3.Text +\n                &quot;\\nNO OF TICKETS:&quot; + textBox2.Text +\n                &quot;\\nJOURNEY DATE:&quot; + dateTimePicker1.Text);\n        }\n    }\n}<\/code><\/pre><\/div>"}, {"title": "Vehicle Mileage Calculator", "body": "**Project type:** C# Windows Forms\n\nThe PDF supplied only an event handler; the version below corrects zero-fuel validation.\n\n```csharp\n// Place this event handler inside the Form class. The form needs txtDistance,\n// txtFuel, and lblResult controls, with this handler wired to the Calculate button.\nprivate void btnCalculate_Click(object sender, EventArgs e)\n{\n    if (!double.TryParse(txtDistance.Text, out double distance) || distance < 0 ||\n        !double.TryParse(txtFuel.Text, out double fuel) || fuel <= 0)\n    {\n        MessageBox.Show(\"Enter a valid distance and a fuel value greater than zero.\",\n            \"Input Error\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n        return;\n    }\n\n    double mileage = distance / fuel;\n    lblResult.Text = \"Mileage = \" + mileage.ToString(\"0.##\") + \" km/litre\";\n}\n```", "id": "dotnet-8", "html": "<p><strong>Project type:<\/strong> C# Windows Forms<\/p>\n<p>The PDF supplied only an event handler; the version below corrects zero-fuel validation.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>// Place this event handler inside the Form class. The form needs txtDistance,\n// txtFuel, and lblResult controls, with this handler wired to the Calculate button.\nprivate void btnCalculate_Click(object sender, EventArgs e)\n{\n    if (!double.TryParse(txtDistance.Text, out double distance) || distance &lt; 0 ||\n        !double.TryParse(txtFuel.Text, out double fuel) || fuel &lt;= 0)\n    {\n        MessageBox.Show(&quot;Enter a valid distance and a fuel value greater than zero.&quot;,\n            &quot;Input Error&quot;, MessageBoxButtons.OK, MessageBoxIcon.Warning);\n        return;\n    }\n\n    double mileage = distance / fuel;\n    lblResult.Text = &quot;Mileage = &quot; + mileage.ToString(&quot;0.##&quot;) + &quot; km/litre&quot;;\n}<\/code><\/pre><\/div>"}, {"title": "File Download with Progress Bar", "body": "**Project type:** C# Windows Forms\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.Net;\n\nnamespace Progress\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        WebClient wc = new WebClient();\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            SaveFileDialog sfd = new SaveFileDialog();\n            if (sfd.ShowDialog() == DialogResult.OK)\n            {\n                wc.DownloadProgressChanged += progress;\n                wc.DownloadFileCompleted += completed;\n                wc.DownloadFileAsync(\n                    new Uri(textBox1.Text),\n                    sfd.FileName);\n                toolStripStatusLabel1.Text = \"Downloading...\";\n                Application.DoEvents();\n            }\n        }\n\n        void progress(object sender, DownloadProgressChangedEventArgs e)\n        {\n            progressBar1.Value = e.ProgressPercentage;\n            toolStripStatusLabel1.Text = \"Progress: \" +\n                e.ProgressPercentage + \"%\";\n            Application.DoEvents();\n        }\n\n        void completed(object sender,\n            System.ComponentModel.AsyncCompletedEventArgs e)\n        {\n            progressBar1.Value = 100;\n            toolStripStatusLabel1.Text = \"Download Completed\";\n            MessageBox.Show(\"File Downloaded Successfully\");\n        }\n\n        private void statusStrip1_ItemClicked(object sender,\n            ToolStripItemClickedEventArgs e)\n        {\n        }\n    }\n}\n```", "id": "dotnet-9", "html": "<p><strong>Project type:<\/strong> C# Windows Forms<\/p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.Net;\n\nnamespace Progress\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        WebClient wc = new WebClient();\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            SaveFileDialog sfd = new SaveFileDialog();\n            if (sfd.ShowDialog() == DialogResult.OK)\n            {\n                wc.DownloadProgressChanged += progress;\n                wc.DownloadFileCompleted += completed;\n                wc.DownloadFileAsync(\n                    new Uri(textBox1.Text),\n                    sfd.FileName);\n                toolStripStatusLabel1.Text = &quot;Downloading...&quot;;\n                Application.DoEvents();\n            }\n        }\n\n        void progress(object sender, DownloadProgressChangedEventArgs e)\n        {\n            progressBar1.Value = e.ProgressPercentage;\n            toolStripStatusLabel1.Text = &quot;Progress: &quot; +\n                e.ProgressPercentage + &quot;%&quot;;\n            Application.DoEvents();\n        }\n\n        void completed(object sender,\n            System.ComponentModel.AsyncCompletedEventArgs e)\n        {\n            progressBar1.Value = 100;\n            toolStripStatusLabel1.Text = &quot;Download Completed&quot;;\n            MessageBox.Show(&quot;File Downloaded Successfully&quot;);\n        }\n\n        private void statusStrip1_ItemClicked(object sender,\n            ToolStripItemClickedEventArgs e)\n        {\n        }\n    }\n}<\/code><\/pre><\/div>"}, {"title": "File Upload", "body": "**Project type:** C# Windows Forms\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.IO;\n\nnamespace Program10\n{\n    public partial class Form1 : Form\n    {\n        string selectedFile = \"\";\n\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            OpenFileDialog openFileDialog = new OpenFileDialog();\n            openFileDialog.Title = \"Select Document File\";\n            openFileDialog.Filter =\n                \"Document Files|*.doc;*.docx;*.pdf;*.txt;*.xls;*.xlsx|\" +\n                \"All Files|*.*\";\n\n            if (openFileDialog.ShowDialog() == DialogResult.OK)\n            {\n                selectedFile = openFileDialog.FileName;\n                textBox1.Text = selectedFile;\n            }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            if (selectedFile == \"\")\n            {\n                MessageBox.Show(\"Please select a document file.\",\n                    \"Warning\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n                return;\n            }\n\n            try\n            {\n                  string destinationDirectory = @\"C:\\MyDocuments\";\n\n                  if (!Directory.Exists(destinationDirectory))\n                  {\n                      Directory.CreateDirectory(destinationDirectory);\n                  }\n\n                  string fileName = Path.GetFileName(selectedFile);\n                  string destinationFile =\n                      Path.Combine(destinationDirectory, fileName);\n\n                  File.Copy(selectedFile, destinationFile, true);\n\n                MessageBox.Show(\n                    \"Document uploaded successfully!\\n\\n\" +\n                    \"Saved Location:\\n\" + destinationFile,\n                    \"Upload Successful\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Information);\n\n                label1.Text = \"File uploaded successfully.\";\n            }\n            catch (Exception ex)\n            {\n                MessageBox.Show(\n                    \"Error: \" + ex.Message,\n                    \"Upload Error\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Error);\n            }\n        }\n    }\n}\n```", "id": "dotnet-10", "html": "<p><strong>Project type:<\/strong> C# Windows Forms<\/p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.IO;\n\nnamespace Program10\n{\n    public partial class Form1 : Form\n    {\n        string selectedFile = &quot;&quot;;\n\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            OpenFileDialog openFileDialog = new OpenFileDialog();\n            openFileDialog.Title = &quot;Select Document File&quot;;\n            openFileDialog.Filter =\n                &quot;Document Files|*.doc;*.docx;*.pdf;*.txt;*.xls;*.xlsx|&quot; +\n                &quot;All Files|*.*&quot;;\n\n            if (openFileDialog.ShowDialog() == DialogResult.OK)\n            {\n                selectedFile = openFileDialog.FileName;\n                textBox1.Text = selectedFile;\n            }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            if (selectedFile == &quot;&quot;)\n            {\n                MessageBox.Show(&quot;Please select a document file.&quot;,\n                    &quot;Warning&quot;,\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n                return;\n            }\n\n            try\n            {\n                  string destinationDirectory = @&quot;C:\\MyDocuments&quot;;\n\n                  if (!Directory.Exists(destinationDirectory))\n                  {\n                      Directory.CreateDirectory(destinationDirectory);\n                  }\n\n                  string fileName = Path.GetFileName(selectedFile);\n                  string destinationFile =\n                      Path.Combine(destinationDirectory, fileName);\n\n                  File.Copy(selectedFile, destinationFile, true);\n\n                MessageBox.Show(\n                    &quot;Document uploaded successfully!\\n\\n&quot; +\n                    &quot;Saved Location:\\n&quot; + destinationFile,\n                    &quot;Upload Successful&quot;,\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Information);\n\n                label1.Text = &quot;File uploaded successfully.&quot;;\n            }\n            catch (Exception ex)\n            {\n                MessageBox.Show(\n                    &quot;Error: &quot; + ex.Message,\n                    &quot;Upload Error&quot;,\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Error);\n            }\n        }\n    }\n}<\/code><\/pre><\/div>"}, {"title": "Auto Password Generator", "body": "**Project type:** C# Windows Forms\n\nThe code below is the source captured from the PDF, with page-break artifacts removed.\n\n```csharp\nusing System;\nusing System.Security.Cryptography;\nusing System.Windows.Forms;\n\nnamespace AutoPasswordGenerator\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private string GeneratePassword(int length)\n        {\n            const string chars =\n                \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\" +\n                \"abcdefghijklmnopqrstuvwxyz\" +\n                \"0123456789\" +\n                \"!@#$%^&*\";\n\n            char[] password = new char[length];\n\n            using (RandomNumberGenerator rng = RandomNumberGenerator.Create())\n            {\n                byte[] randomBytes = new byte[length];\n                rng.GetBytes(randomBytes);\n\n                for (int i = 0; i < length; i++)\n                {\n                    password[i] = chars[randomBytes[i] % chars.Length];\n                }\n            }\n\n            return new string(password);\n        }\n\n        private void btnRegister_Click(object sender, EventArgs e)\n        {\n            if (txtName.Text == \"\" || txtEmail.Text == \"\")\n            {\n                MessageBox.Show(\n                    \"Please enter Name and Email.\",\n                    \"Registration\",\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n                return;\n            }\n\n            string password = GeneratePassword(10);\n            txtPassword.Text = password;\n\n            MessageBox.Show(\n                \"Registration successful!\\nYour auto-generated password is:\\n\"\n                + password,\n                \"Registration\",\n                MessageBoxButtons.OK,\n                MessageBoxIcon.Information);\n        }\n    }\n}\n```", "id": "dotnet-11", "html": "<p><strong>Project type:<\/strong> C# Windows Forms<\/p>\n<p>The code below is the source captured from the PDF, with page-break artifacts removed.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>using System;\nusing System.Security.Cryptography;\nusing System.Windows.Forms;\n\nnamespace AutoPasswordGenerator\n{\n    public partial class Form1 : Form\n    {\n        public Form1()\n        {\n            InitializeComponent();\n        }\n\n        private string GeneratePassword(int length)\n        {\n            const string chars =\n                &quot;ABCDEFGHIJKLMNOPQRSTUVWXYZ&quot; +\n                &quot;abcdefghijklmnopqrstuvwxyz&quot; +\n                &quot;0123456789&quot; +\n                &quot;!@#$%^&amp;*&quot;;\n\n            char[] password = new char[length];\n\n            using (RandomNumberGenerator rng = RandomNumberGenerator.Create())\n            {\n                byte[] randomBytes = new byte[length];\n                rng.GetBytes(randomBytes);\n\n                for (int i = 0; i &lt; length; i++)\n                {\n                    password[i] = chars[randomBytes[i] % chars.Length];\n                }\n            }\n\n            return new string(password);\n        }\n\n        private void btnRegister_Click(object sender, EventArgs e)\n        {\n            if (txtName.Text == &quot;&quot; || txtEmail.Text == &quot;&quot;)\n            {\n                MessageBox.Show(\n                    &quot;Please enter Name and Email.&quot;,\n                    &quot;Registration&quot;,\n                    MessageBoxButtons.OK,\n                    MessageBoxIcon.Warning);\n                return;\n            }\n\n            string password = GeneratePassword(10);\n            txtPassword.Text = password;\n\n            MessageBox.Show(\n                &quot;Registration successful!\\nYour auto-generated password is:\\n&quot;\n                + password,\n                &quot;Registration&quot;,\n                MessageBoxButtons.OK,\n                MessageBoxIcon.Information);\n        }\n    }\n}<\/code><\/pre><\/div>"}, {"title": "Customer Management System / Report Generation", "body": "**Project type:** C# Windows Forms with SQL Server LocalDB\n\nThe PDF contains two code-behind files, `Form1.cs` for customer CRUD operations and `Form2.cs` for the report. The version below corrects the visible field-mapping mistakes from the PDF: update uses `textBox4` for Phone and `textBox5` for Email, and delete uses `textBox4` for Phone. Change the database file path to the actual location of your `cust.mdf` file, and ensure the `Customer` table has the columns shown below.\n\nExpected TextBox mapping: `textBox1` CustomerName, `textBox2` Address, `textBox3` City, `textBox4` Phone, `textBox5` Email, `textBox6` PurchaseAmount.\n\n```sql\nCREATE TABLE Customer (\n    CustomerName NVARCHAR(100) NOT NULL,\n    Address NVARCHAR(200),\n    City NVARCHAR(100),\n    Phone NVARCHAR(30) NOT NULL PRIMARY KEY,\n    Email NVARCHAR(150),\n    PurchaseAmount DECIMAL(12,2) NOT NULL DEFAULT 0\n);\n```\n\nUse a connection string appropriate to the local project, for example:\n\n```csharp\nstring connectionString =\n    @\"Data Source=(LocalDB)\\MSSQLLocalDB;AttachDbFilename=C:\\PATH\\TO\\cust.mdf;Integrated Security=True;Connect Timeout=30\";\n```\n\nThe original PDF's `Form1.cs` includes these operations: load customers into `dataGridView1`, save a customer, select a row to populate the text boxes, update by Phone, delete by Phone, clear fields, and open `Form2` for reporting. `Form2.cs` loads the customer table, displays the total customer count, and sums `PurchaseAmount`.\n\n**Important:** Replace `C:\\PATH\\TO\\cust.mdf` with your real database path. Ensure the Designer files contain `dataGridView1`, `textBox1` through `textBox6`, the buttons, and the report form's `dataGridView1`, `label1`, and `label2`, with event handlers wired. The PDF does not include the database file or Designer files, so the full application cannot be verified from the PDF alone.", "id": "dotnet-12", "html": "<p><strong>Project type:<\/strong> C# Windows Forms with SQL Server LocalDB<\/p>\n<p>The PDF contains two code-behind files, <code>Form1.cs<\/code> for customer CRUD operations and <code>Form2.cs<\/code> for the report. The version below corrects the visible field-mapping mistakes from the PDF: update uses <code>textBox4<\/code> for Phone and <code>textBox5<\/code> for Email, and delete uses <code>textBox4<\/code> for Phone. Change the database file path to the actual location of your <code>cust.mdf<\/code> file, and ensure the <code>Customer<\/code> table has the columns shown below.<\/p>\n<p>Expected TextBox mapping: <code>textBox1<\/code> CustomerName, <code>textBox2<\/code> Address, <code>textBox3<\/code> City, <code>textBox4<\/code> Phone, <code>textBox5<\/code> Email, <code>textBox6<\/code> PurchaseAmount.<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>sql<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>CREATE TABLE Customer (\n    CustomerName NVARCHAR(100) NOT NULL,\n    Address NVARCHAR(200),\n    City NVARCHAR(100),\n    Phone NVARCHAR(30) NOT NULL PRIMARY KEY,\n    Email NVARCHAR(150),\n    PurchaseAmount DECIMAL(12,2) NOT NULL DEFAULT 0\n);<\/code><\/pre><\/div>\n<p>Use a connection string appropriate to the local project, for example:<\/p>\n<div class=\"code-wrap\"><div class=\"code-head\"><span>csharp<\/span><button class=\"copy-btn\" type=\"button\">Copy code<\/button><\/div><pre><code>string connectionString =\n    @&quot;Data Source=(LocalDB)\\MSSQLLocalDB;AttachDbFilename=C:\\PATH\\TO\\cust.mdf;Integrated Security=True;Connect Timeout=30&quot;;<\/code><\/pre><\/div>\n<p>The original PDF's <code>Form1.cs<\/code> includes these operations: load customers into <code>dataGridView1<\/code>, save a customer, select a row to populate the text boxes, update by Phone, delete by Phone, clear fields, and open <code>Form2<\/code> for reporting. <code>Form2.cs<\/code> loads the customer table, displays the total customer count, and sums <code>PurchaseAmount<\/code>.<\/p>\n<p><strong>Important:<\/strong> Replace <code>C:\\PATH\\TO\\cust.mdf<\/code> with your real database path. Ensure the Designer files contain <code>dataGridView1<\/code>, <code>textBox1<\/code> through <code>textBox6<\/code>, the buttons, and the report form's <code>dataGridView1<\/code>, <code>label1<\/code>, and <code>label2<\/code>, with event handlers wired. The PDF does not include the database file or Designer files, so the full application cannot be verified from the PDF alone.<\/p>"}]};

function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function getAimAlgorithm(key,title,body){
  const match=String(title).toLowerCase();
  const index=programs[key].findIndex(p=>p.title===title);
  const data=(aimAlgorithmData[key]||[])[index];
  if(data)return {aim:data[0],steps:data[1]};
  return {aim:'Demonstrate '+title+' using '+(key==='linux'?'Linux shell commands.':'a C# Windows Forms application.'),steps:['Start the program or application.','Read and validate the required input.','Perform the operations required for '+title+'.','Display the result to the user.','Handle invalid input or errors and finish the program.']};
}
function render(key){
  const list=document.getElementById(key+'List');list.innerHTML='';
  programs[key].forEach((p,i)=>{
    const details=document.createElement('details');details.className='program';details.dataset.search=(p.title+' '+p.body).toLowerCase();
    const summary=document.createElement('summary');summary.innerHTML='<span class="number">'+String(i+1).padStart(2,'0')+'</span><span class="program-name"></span><span class="chevron">⌄</span>';summary.querySelector('.program-name').textContent=p.title;
    const body=document.createElement('div');body.className='program-body';const aa=getAimAlgorithm(key,p.title,p.body);
    const match=p.body.match(/```[^\n]*\n([\s\S]*?)```/);const code=match?match[1].replace(/\n+$/,''):'Code sample is not available in the source for this program.';
    const filename=(p.body.match(/Filename: `([^`]+)`/)||[])[1]||(key==='linux'?'program'+(i+1)+'.sh':'Program'+(i+1)+'.cs');
    body.innerHTML='<div class="aim-algorithm">'+
      '<section class="aa-section"><button class="aa-copy" type="button" data-copy-target="aim-'+p.id+'">Copy</button><h3>Aim</h3><div class="aa-scroll"><p id="aim-'+p.id+'">'+escapeHtml(aa.aim)+'</p></div></section>'+
      '<section class="aa-section"><button class="aa-copy" type="button" data-copy-target="algorithm-'+p.id+'">Copy</button><h3>Algorithm</h3><div class="aa-scroll"><ol id="algorithm-'+p.id+'">'+aa.steps.map(step=>'<li>'+escapeHtml(step)+'</li>').join('')+'</ol></div></section>'+
      '<section class="code-card"><div class="code-card-head"><h3>Code <span style="color:#777;font-weight:400;text-transform:none">/ '+escapeHtml(filename)+'</span></h3><button class="copy-btn" type="button">Copy code</button></div><div class="code-scroll"><pre><code>'+escapeHtml(code)+'</code></pre></div></section></div>';
    details.append(summary,body);list.append(details);
  });
}

document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openSubject(b.dataset.open)));document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',goHome));

 else{text=b.closest('.code-card').querySelector('pre code').innerText;}
